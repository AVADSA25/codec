    <script>/* Theme before first paint, so the page never flashes dark: same key and attribute as applyTheme() below. */try{(function(){function _lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}var t=_lsGet('codec-theme');if(t!=='light'&&t!=='dark'){try{t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}catch(e){t='dark'}}document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='light'?(m.getAttribute('data-light')||'#faf8f5'):'#121215'})()}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CODEC — Voice Call</title>
    <link rel="icon" href="/favicon.png">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/static/codec.css?v=7e1ba93b">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        /* Colours and type are the shared tokens (static/codec.css), so the light and dark themes match the rest
           of CODEC. These are the page's older short names for them. */
        :root {
          --bg2: var(--surface); --bd: var(--border); --tx: var(--text); --tx2: var(--text-muted);
          --ac: var(--accent); --border-hover: var(--border-strong); --radius: 10px;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--tx);
            position: relative;
        }
        /* The shell (static/codec-shell.js) makes body a 100dvh column; the call is its .cs-main. */
        .call-container.cs-main { overflow-y: auto; }

        /* ── Scrollbar ── */
        * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* Main layout: centred when it fits, scrolling from the top when it does not (auto margins; a
           justify-content: center column taller than the screen would lose its top). */
        .call-container {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            gap: 20px; max-width: 600px; width: 100%; padding: 28px 20px;
            margin: 0 auto;
        }
        .call-container > :first-child { margin-top: auto; }
        .call-container > :last-child { margin-bottom: auto; }

        /* ── The orb (P2.9): one circle whose size follows --lvl, 0 to 1 (the mic level while listening,
           the reply's level while CODEC speaks). It breathes while CODEC works. Hold it to talk. ── */
        .avatar-wrap {
            --lvl: 0;
            position: relative; width: 200px; height: 200px; flex: none;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; cursor: pointer; -webkit-touch-callout: none;
            user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .avatar-wrap:focus-visible { outline: none; box-shadow: var(--focus-ring); }
        .orb {
            width: 64%; height: 64%; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: var(--surface-2); border: 2px solid var(--border);
            transform: scale(calc(1 + var(--lvl) * 0.3));
            transition: transform 0.2s ease-out, background-color 0.3s, border-color 0.3s;
        }
        .orb img { width: 44%; height: 44%; object-fit: contain; pointer-events: none; }
        .state-listening .orb { background: var(--success-tint); border-color: var(--success); }
        .state-speaking .orb { background: var(--accent-dim); border-color: var(--accent); }
        .state-processing .orb,
        .state-analyzing_screen .orb { border-color: var(--info); animation: breathe 2.4s ease-in-out infinite; }
        .avatar-wrap.muted .orb { background: var(--surface-2); border-color: var(--border-strong); border-style: dashed; }
        .avatar-wrap.holding .orb { background: var(--success-tint); border-color: var(--success); border-style: solid; border-width: 4px; }
        @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        /* Timer, caption, hints */
        .call-meta { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
        .timer {
            font-family: var(--font-mono); font-size: var(--fs-24); font-weight: 300;
            color: var(--text-muted); letter-spacing: 0.06em; font-variant-numeric: tabular-nums;
            min-height: 1.25em;
        }
        .status { font-size: var(--fs-16); color: var(--text); min-height: 1.5em; }
        /* One hint line during a call: the server's "Speak to interrupt" while CODEC speaks or works,
           the hold-to-talk hint otherwise. */
        .interrupt-hint, .hold-hint { display: none; font-size: var(--fs-13); color: var(--text-dim); min-height: 1.45em; }
        body.in-call.state-speaking .interrupt-hint,
        body.in-call.state-processing .interrupt-hint,
        body.in-call.state-analyzing_screen .interrupt-hint,
        body.in-call:not(.state-speaking):not(.state-processing):not(.state-analyzing_screen) .hold-hint { display: block; }

        /* Call button: a flat circle, green to start and red to end. */
        .call-btn {
            width: 64px; height: 64px; border-radius: 50%; border: none; cursor: pointer; flex: none;
            display: flex; align-items: center; justify-content: center;
            background: var(--success); color: var(--on-accent);
            transition: background-color 0.15s, transform 0.1s;
        }
        .call-btn.end { background: var(--danger); }
        .call-btn:hover { filter: brightness(0.94); }
        .call-btn:active { transform: scale(0.96); }
        .call-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
        .call-btn svg { fill: currentColor; }

        /* ── Call controls ── */
        .action-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        body:not(.in-call) .action-row { display: none; }
        .action-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 7px 14px; border-radius: var(--radius-pill);
            border: 1px solid var(--border); background: var(--surface); color: var(--text);
            font-family: var(--font-sans); font-size: var(--fs-13); font-weight: var(--fw-medium); line-height: 1.2;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .action-btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
        .action-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
        .action-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
        .action-btn[aria-pressed="true"] { background: var(--danger-tint); border-color: var(--danger); color: var(--danger-text); }
        .action-btn .when-muted { display: none; }
        .action-btn[aria-pressed="true"] .when-muted { display: inline; }
        .action-btn[aria-pressed="true"] .when-live { display: none; }
        .action-btn.stop-speaking,
        .action-btn.nudge { display: none; }
        body.state-speaking .action-btn.stop-speaking,
        body.state-processing .action-btn.stop-speaking,
        body.state-analyzing_screen .action-btn.stop-speaking { display: inline-flex; }
        .stop-speaking .when-working { display: none; }
        body.state-processing .stop-speaking .when-working,
        body.state-analyzing_screen .stop-speaking .when-working { display: inline; }
        body.state-processing .stop-speaking .when-speaking,
        body.state-analyzing_screen .stop-speaking .when-speaking { display: none; }
        body.state-processing .action-btn.nudge { display: inline-flex; }
        body.state-speaking .action-btn.your-turn,
        body.state-processing .action-btn.your-turn,
        body.state-analyzing_screen .action-btn.your-turn { display: none; }

        /* Microphone picker */
        .mic-row { display: flex; align-items: center; gap: 8px; font-size: var(--fs-13); color: var(--text-muted); }
        .mic-row[hidden] { display: none; }
        .mic-select {
            max-width: 240px; padding: 6px 10px; border-radius: var(--radius-8);
            border: 1px solid var(--border); background: var(--surface); color: var(--text);
            font-family: var(--font-sans); font-size: var(--fs-14);
        }
        .mic-select:focus-visible { outline: none; box-shadow: var(--focus-ring); }

        /* ── Transcript: chat bubbles ── */
        .transcript-wrap {
            width: 100%; max-width: 560px; background: var(--surface);
            border: 1px solid var(--border); border-radius: var(--radius-12);
            overflow: hidden; display: flex; flex-direction: column;
            min-height: 180px;   /* shrinks with the screen down to this, then the page scrolls */
        }
        .transcript-header {
            padding: 8px 10px 8px 16px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; gap: 8px;
            font-family: var(--font-mono); font-size: var(--fs-12); font-weight: var(--fw-semibold);
            letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);
        }
        .tx-tools { display: flex; align-items: center; gap: 6px; }
        .tx-copy-btn {
            display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px;
            font-family: var(--font-sans); font-size: var(--fs-12); font-weight: var(--fw-medium);
            letter-spacing: 0; text-transform: none; white-space: nowrap;
            color: var(--text-muted); background: transparent;
            border: 1px solid var(--border); border-radius: var(--radius-8); cursor: pointer;
        }
        .tx-copy-btn:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
        .tx-copy-btn:disabled { opacity: 0.45; cursor: default; }
        .tx-copy-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
        .tx-copy-btn.copied { color: var(--success-text); border-color: var(--success); }
        .tx-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); flex: none; }
        .state-listening .tx-dot { background: var(--success); }
        .state-speaking .tx-dot { background: var(--accent); }
        .state-processing .tx-dot,
        .state-analyzing_screen .tx-dot { background: var(--info); }

        .transcript {
            max-height: 320px; overflow-y: auto; padding: 14px 14px 16px;
            display: flex; flex-direction: column; gap: 8px;
            font-size: var(--fs-16); line-height: var(--lh-16);
        }
        .tx-line { max-width: 85%; overflow-wrap: anywhere; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
        .tx-line.user {
            align-self: flex-end; padding: 8px 14px; background: var(--accent-dim);
            border-radius: var(--radius-20) var(--radius-20) 6px var(--radius-20);
        }
        .tx-line.assistant {
            align-self: flex-start; padding: 8px 14px; background: var(--surface-2);
            border-radius: var(--radius-20) var(--radius-20) var(--radius-20) 6px;
        }
        .tx-line.system { align-self: center; max-width: 100%; font-size: var(--fs-13); color: var(--text-muted); text-align: center; }
        .tx-label { display: block; font-size: var(--fs-12); font-weight: var(--fw-semibold); color: var(--text-muted); line-height: 1.4; }
        .tx-chip {
            align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
            border: 1px solid var(--border); border-radius: var(--radius-pill); background: var(--surface);
            font-size: var(--fs-12); color: var(--text-muted);
        }
        .tx-chip svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
        .cursor {
            display: inline-block; width: 2px; height: 1em; background: var(--text-muted);
            margin-left: 2px; vertical-align: text-bottom; animation: blink 0.7s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* ── Type box: a typed turn goes through the same call ── */
        .type-row { width: 100%; max-width: 560px; display: flex; gap: 8px; }
        body:not(.in-call) .type-row { display: none; }
        .type-row input {
            flex: 1; min-width: 0; padding: 10px 16px; border-radius: var(--radius-pill);
            border: 1px solid var(--border); background: var(--surface); color: var(--text);
            font-family: var(--font-sans); font-size: var(--fs-16);
        }
        .type-row input::placeholder { color: var(--text-dim); }
        .type-row input:focus-visible { outline: none; box-shadow: var(--focus-ring); }
        .type-send {
            width: 42px; height: 42px; flex: none; border-radius: 50%; border: none; cursor: pointer;
            background: var(--accent); color: var(--on-accent);
            display: flex; align-items: center; justify-content: center;
        }
        .type-send:disabled { opacity: 0.4; cursor: default; }
        .type-send:focus-visible { outline: none; box-shadow: var(--focus-ring); }
        .type-send svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        @media (prefers-reduced-motion: reduce) {
          .orb { transition: none; animation: none !important; transform: none; }
          .tx-line, .cursor { animation: none; }
        }

        /* ── Phone ── */
        @media (max-width: 767px) {
          .call-container { gap: 14px; padding: 16px; }
          .avatar-wrap { width: 120px; height: 120px; }
          .transcript-wrap { min-height: 160px; }
          .transcript { max-height: 240px; }
          .call-btn { width: 58px; height: 58px; }
          .timer { font-size: var(--fs-20); }
          /* 16px or more, so iOS does not zoom into the field */
          .mic-select, .type-row input { font-size: max(16px, var(--fs-16)); }
        }
        .webcam-pip{position:fixed;bottom:80px;right:20px;width:240px;border-radius:14px;overflow:hidden;border:2px solid var(--accent);box-shadow:0 4px 24px rgba(0,0,0,.5);z-index:9999;display:none;background:#000;transition:width .3s,height .3s,border-radius .3s}
        .webcam-pip img,.webcam-pip video{width:100%;display:block}
        .webcam-pip.expanded{width:640px;max-width:90vw;border-radius:10px}
        .pip-bar{display:flex;justify-content:center;gap:10px;padding:6px;background:rgba(0,0,0,.6)}
        .pip-btn{background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
        .pip-btn:hover{background:var(--accent)}
        .pip-btn.snap-btn{background:rgba(255,80,80,.7)}
        .pip-btn.snap-btn:hover{background:#e33}
        /* ── Screenshot/Photo Modal ── */
        .modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); z-index:100; justify-content:center; align-items:center; padding:20px; }
        .modal-overlay.show { display:flex; }
        .modal-overlay img { max-width:100%; max-height:90vh; border-radius:var(--radius); border:1px solid var(--border); }
        .modal-close { position:fixed; top:16px; right:16px; background:var(--surface); color:var(--text); border:1px solid var(--border); width:32px; height:32px; border-radius:50%; font-size:calc(18px * var(--fs-scale)); cursor:pointer; z-index:101; display:flex; align-items:center; justify-content:center; }
        /* ── Voice mode pills (flash / default / think) ── */
        .mode-row { display:flex; gap:8px; justify-content:center; }
        .mode-pill {
            background:var(--surface-2); border:1px solid var(--border);
            color:var(--text-muted); font-family:var(--font-sans); font-size:var(--fs-12); font-weight:var(--fw-semibold);
            letter-spacing:1px; padding:5px 14px; border-radius:var(--radius-pill); cursor:pointer;
            transition:background-color .15s, color .15s, border-color .15s; text-transform:uppercase;
        }
        .mode-pill:hover { color:var(--text); border-color:var(--border-strong); }
        .mode-pill:focus-visible { outline:none; box-shadow:var(--focus-ring); }
        .mode-pill.active { color:var(--on-accent); background:var(--accent); border-color:var(--accent); }
    </style>
</head>
<body id="body">
<script src="/static/codec-shell.js?v=17524114" data-page="voice" data-title="Voice" data-status></script>
    <div class="call-container cs-main">

        <!-- The orb: its size follows the level. Press and hold it to talk. -->
        <div class="avatar-wrap" id="avatarWrap" role="button" tabindex="0" aria-label="Hold to talk">

        </div>

        <div class="call-meta">
            <div class="timer" id="timer"></div>
            <div class="status" id="statusLabel" aria-live="polite">Tap to start voice call</div>

        </div>

        <!-- Voice mode: flash / default / think (docs/VOICE-MODES-DESIGN.md) -->
        <div class="mode-row" id="modeRow">
            <button class="mode-pill" id="modeFlash" onclick="setVoiceMode('flash')" title="Fastest replies — trimmed context, one-sentence answers"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>Flash</button>
            <button class="mode-pill active" id="modeDefault" onclick="setVoiceMode('default')" title="Standard voice chat">Normal</button>
            <button class="mode-pill think" id="modeThink" onclick="setVoiceMode('think')" title="Live tool calling — lights, music, web, calendar, email — with spoken progress"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M12 2C9 2 6.5 4 6 7c-2 .5-4 3-4 5.5C2 15 4 17 6.5 17H7v2a2 2 0 002 2h6a2 2 0 002-2v-2h.5C20 17 22 15 22 12.5 22 10 20 7.5 18 7c-.5-3-3-5-6-5z"/></svg>Think</button>
        </div>

        <!-- Call controls: mute, stop speaking, your turn, still there? -->
        <div class="action-row" id="actionRow">
            <button class="action-btn" id="muteBtn" aria-label="Mute" aria-pressed="false" onclick="toggleMute()">
                <svg viewBox="0 0 24 24" class="when-live"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
                <svg viewBox="0 0 24 24" class="when-muted"><path d="M3 3l18 18"/><path d="M9 9v2a3 3 0 0 0 5.1 2.1M15 10V6a3 3 0 0 0-5.7-1.3"/><path d="M5 11a7 7 0 0 0 11.5 5.4M19 11a7 7 0 0 1-.6 2.8"/><path d="M12 18v3"/></svg>
                <span class="when-live">Mute</span><span class="when-muted">Unmute</span>
            </button>
            <button class="action-btn stop-speaking" id="stopSpeakBtn" aria-label="Stop speaking" onclick="stopSpeaking()">
                <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                <span class="when-speaking">Stop speaking</span><span class="when-working">Stop</span>
            </button>
            <button class="action-btn your-turn" id="yourTurnBtn" onclick="sendYourTurn()">
                <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
                Your Turn
            </button>
            <button class="action-btn nudge" id="nudgeBtn" onclick="sendNudge()">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                Still there?
            </button>
        </div>

        <button class="call-btn start" id="callBtn" onclick="toggleCall()" aria-label="Start call"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg></button>

        <!-- Transcript -->
        <div class="transcript-wrap">
            <div class="transcript-header">
                <span>Transcript</span>
                <div class="tx-tools">
                    <button id="continueChatBtn" class="tx-copy-btn" onclick="continueInChat()" disabled title="Save this call as a chat and open it">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
                        Continue in chat
                    </button>
                    <button id="copyTxBtn" class="tx-copy-btn" title="Copy transcript">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        <span id="copyTxLabel">Copy</span>

                    <div class="tx-dot" id="txDot"></div>
                </div>
            </div>
            <div class="transcript" id="transcript">
                <div class="tx-line system" data-role="system"><span class="tx-text">CODEC Voice — Ready</span></div>
            </div>
        </div>

        <!-- Type a turn instead of saying it (sent as {type:'text'}) -->
        <form class="type-row" id="typeForm" onsubmit="sendTyped(event)">
            <input id="typeInput" type="text" maxlength="2000" placeholder="Type a message" autocomplete="off" aria-label="Type a message" disabled>
            <button type="submit" class="type-send" id="typeSend" aria-label="Send" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
        </form>

        <!-- Microphone: kept in this browser (codec-voice-mic) -->
        <label class="mic-row" id="micRow" for="micSelect">Microphone
            <select id="micSelect" class="mic-select" onchange="chooseMic(this.value)"><option value="">Default microphone</option></select>
        </label>

    <script>
/* Safe storage accessors — use these, never localStorage/sessionStorage directly.

   Storage access THROWS when blocked; it does not return null. Safari private
   mode, a hardened profile, and an iframe whose third-party storage is blocked
   all raise on the FIRST touch. An unguarded read at the top level of a script
   therefore kills that entire script: every statement after it, theme init
   included, silently never runs, and the page looks fine while being half-dead.
   That is exactly what happened to cortex, which the dashboard embeds in an
   iframe. Reads degrade to null, writes to no-ops — a page with no persisted
   preferences beats a page with no JavaScript. */
function _lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}

    /* While CODEC speaks, the orb follows the reply audio. */

    /* ── UI helpers ── */
    function setState(s) {

            .replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

    /* ── Audio playback ── */
    async function playNext() {
        if (!audioQueue.length) {
            isPlaying = false;
            if (isInCall) setState('listening');

        isPlaying = true;
        setState('speaking');
        var data = audioQueue.shift();
        try {
            /* slice to detach, then decode */
            var buf = await audioCtx.decodeAudioData(data.slice(0));
            var src = audioCtx.createBufferSource();
            src.buffer = buf;
            src.connect(outAnalyser || audioCtx.destination);

            src.start();
            curSource = src;
            if (!levelRaf && outAnalyser) levelRaf = requestAnimationFrame(levelLoop);
        } catch(e) {
            console.warn('[Voice] Decode error:', e);
            playNext();
        }
    }

    function queueAudio(data) {
        /* Dedup guard: skip if last queued chunk is identical (same bytes) */
        if (audioQueue.length > 0) {

            }
        }
        audioQueue.push(data);
        if (!isPlaying) playNext();
    }

    function stopAudio() {

    /* ── WebSocket with auto-reconnect ── */
    var wsRetryCount = 0;

    function connectWS() {

                        else if (msg.status === 'analyzing_screen') setState('analyzing_screen');

            wsIntentionalClose = true;
            if (ws && ws.readyState === WebSocket.OPEN) { try { ws.close(); } catch(e) {} }
            stopMic();
        });

        ws.onclose = function() {
            if (wsPingTimer) { clearInterval(wsPingTimer); wsPingTimer = null; }

                addTranscript('system', 'Disconnected — transcript saved to memory');
                return;
            }
            /* Unexpected disconnect — try to reconnect */
            if (isInCall && wsRetryCount < wsRetryMax) {
                wsRetryCount++;
                var delay = Math.min(wsRetryDelay, 30000);
                addTranscript('system', 'Connection lost — reconnecting in ' + Math.round(delay/1000) + 's... (attempt ' + wsRetryCount + '/' + wsRetryMax + ')');
                setState('processing');
                stopMic();
                wsRetryTimer = setTimeout(function() {
                    if (isInCall) connectWS();
                }, delay);
                wsRetryDelay *= 2;
            } else if (isInCall) {
                addTranscript('system', 'Connection lost — could not reconnect after ' + wsRetryMax + ' attempts');
                endCall();
            }
        };

        ws.onerror = function(e) {
            console.error('[Voice] WS error:', e);
        };
    }

    /* ── Microphone ── */
    /* The chosen microphone (the picker), or the default one when it is gone. */
    async function openMicStream() {
        var want = _lsGet(MIC_KEY) || '';
        var audio = { sampleRate: 16000, channelCount: 1, echoCancellation: true,
                      noiseSuppression: true, autoGainControl: true };
        if (want) audio.deviceId = { exact: want };
        try {
            return await navigator.mediaDevices.getUserMedia({ audio: audio });
        } catch (e) {
            if (!want || (e.name !== 'OverconstrainedError' && e.name !== 'NotFoundError')) throw e;
            delete audio.deviceId;
            _lsDel(MIC_KEY);
            showToast('That microphone is not available, so the default one is on.');
            return await navigator.mediaDevices.getUserMedia({ audio: audio });
        }
    }

    async function startMic() {

            outAnalyser.fftSize = 1024;

            micSource = audioCtx.createMediaStreamSource(mediaStream);
            /* 4096-sample chunks ~= 256 ms at 16 kHz */
            processor = audioCtx.createScriptProcessor(4096, 1, 1);
            processor.onaudioprocess = function(e) {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;
                var f32 = e.inputBuffer.getChannelData(0);

                /* ── Always compute RMS for the orb + interrupt (a muted track gives silence) ── */
                var sum = 0;
                for (var j = 0; j < f32.length; j++) sum += f32[j] * f32[j];
                var rms = Math.sqrt(sum / f32.length) * 32768;

                /* ── The orb follows the mic while listening ── */
                if (document.getElementById('body').classList.contains('state-listening')) setLevel(rms / 2800);

                /* ── Interrupt detection: if Q is speaking and user talks ── */
                if (isPlaying) {
                    var now = Date.now();
                    if (rms > INTERRUPT_RMS && (now - lastInterruptAt) > 1200) {
                        lastInterruptAt = now;
                        ws.send(JSON.stringify({ type: 'interrupt' }));
                        stopAudio();
                        setState('listening');
                        console.log('[Voice] Interrupt sent — rms=' + Math.round(rms));
                    }
                }

                var i16 = new Int16Array(f32.length);
                for (var i = 0; i < f32.length; i++) {
                    var s = Math.max(-1, Math.min(1, f32[i]));
                    i16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                ws.send(i16.buffer);
            };
            micSource.connect(processor);
            processor.connect(audioCtx.destination);
            applyMute();
            refreshMics();
        } catch(e) {
            addTranscript('system', 'Microphone error: ' + e.message + '. You can still type.');
        }
    }

    /* Switch to another microphone during a call: only the mic stream changes;
       the socket and the reply audio carry on. */
    async function swapMic() {
        if (!audioCtx || !processor) { if (audioCtx) { stopMic(); } return startMic(); }
        try {
            var s = await openMicStream();
            if (micSource) { try { micSource.disconnect(); } catch (e) {} }
            if (mediaStream) mediaStream.getTracks().forEach(function(t){ t.stop(); });
            mediaStream = s;
            micSource = audioCtx.createMediaStreamSource(s);
            micSource.connect(processor);
            applyMute();
            refreshMics();
        } catch (e) {
            showToast('Could not switch the microphone: ' + e.message);
        }
    }

    function stopMic() {
        if (levelRaf)     { cancelAnimationFrame(levelRaf); levelRaf = null; }
        if (micSource)    { try { micSource.disconnect(); } catch (e) {} micSource = null; }
        if (processor)    { processor.disconnect();  processor    = null; }
        if (mediaStream)  { mediaStream.getTracks().forEach(function(t){ t.stop(); }); mediaStream = null; }
        if (audioCtx)     { audioCtx.close();         audioCtx     = null; }
        outAnalyser = null;
        setLevel(0);
    }

    /* The picker lists the audio inputs; names show once the browser has granted the mic. */
    function refreshMics() {
        var sel = document.getElementById('micSelect'), row = document.getElementById('micRow');
        if (!sel) return;
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) { if (row) row.hidden = true; return; }
        navigator.mediaDevices.enumerateDevices().then(function(devs) {
            var want = _lsGet(MIC_KEY) || '';
            var ins = devs.filter(function(d) {
                return d.kind === 'audioinput' && d.deviceId && d.deviceId !== 'default' && d.deviceId !== 'communications';
            });
            sel.innerHTML = '';
            var def = document.createElement('option');
            def.value = ''; def.textContent = 'Default microphone';
            sel.appendChild(def);
            ins.forEach(function(d, i) {
                var o = document.createElement('option');
                o.value = d.deviceId; o.textContent = d.label || ('Microphone ' + (i + 1));
                sel.appendChild(o);
            });
            sel.value = ins.some(function(d) { return d.deviceId === want; }) ? want : '';
        }).catch(function() {});
    }
    function chooseMic(id) {
        if (id) _lsSet(MIC_KEY, id); else _lsDel(MIC_KEY);
        if (isInCall && audioCtx) swapMic();
    }
    if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
        navigator.mediaDevices.addEventListener('devicechange', refreshMics);
    }
    refreshMics();

    /* ── Mute: the mic track goes silent (the server's voice detection closes any open utterance).
       Holding the orb while muted talks for as long as the hold lasts. ── */
    function applyMute() {
        var live = !micMuted || isHolding;
        if (mediaStream) mediaStream.getAudioTracks().forEach(function(t) { t.enabled = live; });
        var b = document.getElementById('muteBtn');
        if (b) b.setAttribute('aria-pressed', micMuted ? 'true' : 'false');
        var w = document.getElementById('avatarWrap');
        if (w) w.classList.toggle('muted', micMuted && !isHolding);
        var h = document.getElementById('holdHint');
        if (h) h.textContent = micMuted ? 'Muted. Hold the circle to talk.' : 'Hold the circle to talk, let go to send';
        if (!live) setLevel(0);
    }
    function toggleMute() {
        micMuted = !micMuted;
        applyMute();
    }

    /* ── Stop speaking: the existing interrupt, and the queued reply audio stops here too. ── */
    function stopSpeaking() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            try { ws.send(JSON.stringify({ type: 'interrupt' })); } catch (e) {}
        }
        stopAudio();
        if (isInCall) setState('listening');
    }

    /* ── Type box: a typed turn runs through the same call (server control 'text'). ── */
    function setTyping(on) {
        var i = document.getElementById('typeInput'), b = document.getElementById('typeSend');
        if (i) i.disabled = !on;
        if (b) b.disabled = !on;
    }
    function sendTyped(ev) {
        if (ev) ev.preventDefault();
        var input = document.getElementById('typeInput');
        var text = (input.value || '').trim().slice(0, 2000);
        if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ type: 'text', text: text }));
        txAppend('user', text);   /* the server does not echo a typed turn */
        input.value = '';
    }

    /* ── Continue in chat: the call's You and CODEC lines become a new chat. ── */
    function callMessages() {
        var out = [];
        document.querySelectorAll('#transcript .tx-line.user, #transcript .tx-line.assistant').forEach(function(el) {
            var t = el.querySelector('.tx-text');
            var text = (t ? t.textContent : '').trim();
            if (text) out.push({ role: el.classList.contains('user') ? 'user' : 'assistant', content: text });
        });
        return out;
    }
    function syncContinue() {
        var b = document.getElementById('continueChatBtn');
        if (b && !b.dataset.busy) b.disabled = !document.querySelector('#transcript .tx-line.user, #transcript .tx-line.assistant');
    }
    function continueInChat() {
        var msgs = callMessages();
        var btn = document.getElementById('continueChatBtn');
        if (!msgs.length || btn.dataset.busy) return;
        btn.dataset.busy = '1'; btn.disabled = true;
        var id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        var d = new Date();
        var title = 'Voice call ' + d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ' ' +
                    String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        fetch('/api/qchat/save', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                   body: JSON.stringify({ session_id: id, title: title, messages: msgs }) })
            .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(function() {
                if (isInCall) endCall();
                location.href = '/chat#session=' + encodeURIComponent(id);
            })
            .catch(function(e) {
                delete btn.dataset.busy; syncContinue();
                showToast('Could not save the call as a chat: ' + e.message);
            });
    }

    /* ── Call control ── */
    function toggleCall() {
        if (isInCall) endCall(); else startCall();
    }

    function startCall() {
        isInCall   = true;
        callStart  = Date.now();
        var btn    = document.getElementById('callBtn');
        btn.className = 'call-btn end';
        btn.setAttribute('aria-label', 'End call');
        btn.innerHTML = '<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z" transform="rotate(135 12 12)"/></svg>';
        document.getElementById('body').classList.add('in-call');
        timerIv = setInterval(updateTimer, 1000);
        document.getElementById('timer').textContent = '00:00';
        document.getElementById('transcript').innerHTML = '';
        streamLine = null; streamText = '';
        addTranscript('system', 'Connecting…');
        setState('processing');
        connectWS();
    }

    function endCall() {
        isInCall = false;
        var btn = document.getElementById('callBtn');
        btn.className = 'call-btn start';
        btn.setAttribute('aria-label', 'Start call');
        btn.innerHTML = '<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>';
        document.getElementById('body').classList.remove('in-call');
        setTyping(false);
        if (timerIv) { clearInterval(timerIv); timerIv = null; }
        stopAudio();
        stopMic();
        if (wsRetryTimer) { clearTimeout(wsRetryTimer); wsRetryTimer = null; }
        if (wsPingTimer)  { clearInterval(wsPingTimer);  wsPingTimer  = null; }
        wsIntentionalClose = true;
        if (ws) {
            try { ws.send(JSON.stringify({type: 'end_call'})); } catch(e) {}
            try { ws.close(); } catch(e){}
            ws = null;
        }
        wsSessionId = null; /* clear session — no resume after intentional end */
        setState('idle');
        document.getElementById('statusLabel').textContent = 'Call ended — transcript saved to memory';
    }

    function updateTimer() {
        var s = Math.floor((Date.now() - callStart) / 1000);
        document.getElementById('timer').textContent =
            String(Math.floor(s / 60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0');
    }

    /* ── "Your Turn" — force-send current audio buffer as utterance ── */
    /* ── Voice modes (flash / default / think) ── */
    var voiceMode = 'default';
    function updateModePills(m) {
        voiceMode = m || 'default';
        var ids = { flash: 'modeFlash', 'default': 'modeDefault', think: 'modeThink' };
        Object.keys(ids).forEach(function(k) {
            var el = document.getElementById(ids[k]);
            if (el) el.classList.toggle('active', k === voiceMode);
        });
    }
    function setVoiceMode(m) {
        updateModePills(m);  /* optimistic — server ack confirms */
        if (ws && ws.readyState === WebSocket.OPEN) {
            try { ws.send(JSON.stringify({ type: 'mode', mode: m })); } catch (e) {}
        }
    }

    function sendYourTurn() {
        if (!ws || ws.readyState !== WebSocket.OPEN || !isInCall) return;
        ws.send(JSON.stringify({ type: 'your_turn' }));
        setState('processing');
        document.getElementById('statusLabel').textContent = 'Got it — processing…';
        // Brief haptic feedback on mobile
        if (navigator.vibrate) navigator.vibrate(30);
    }

    /* ── Nudge — poke the AI when processing seems stuck ── */
    function sendNudge() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ type: 'nudge' }));
        document.getElementById('statusLabel').textContent = 'Nudged — hang on…';
        if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
    }

    /* ── Hold-to-talk on the orb (mouse, touch, and Space or Enter on the focused orb).
       While muted, the hold is push to talk. ── */
    (function() {
        var avatar = document.getElementById('avatarWrap');
        var holdTimer = null;

        function startHold(e) {
            if (!isInCall || isHolding || holdTimer) return;
            e.preventDefault();
            holdTimer = setTimeout(function() {
                holdTimer = null;
                isHolding = true;
                avatar.classList.add('holding');
                applyMute();
                // Unmute / signal "user speaking" to server
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'hold_start' }));
                }
                if (navigator.vibrate) navigator.vibrate(15);
            }, 200); // 200ms threshold to distinguish tap from hold
        }

        function endHold(e) {
            if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
            if (!isHolding) return;
            isHolding = false;
            avatar.classList.remove('holding');
            // Signal "done talking" — force send
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'your_turn' }));
            }
            setState('processing');
            /* Muted again only after the last of the held speech has gone out. */
            setTimeout(applyMute, 300);
        }

        avatar.addEventListener('touchstart', startHold, { passive: false });
        avatar.addEventListener('touchend', endHold);
        avatar.addEventListener('touchcancel', endHold);
        avatar.addEventListener('mousedown', startHold);
        avatar.addEventListener('mouseup', endHold);
        avatar.addEventListener('mouseleave', endHold);
        avatar.addEventListener('keydown', function(e) { if (e.key === ' ' || e.key === 'Enter') startHold(e); });
        avatar.addEventListener('keyup', function(e) { if (e.key === ' ' || e.key === 'Enter') endHold(e); });
    })();

    /* ── Copy transcript button ── */
    (function() {
        var btn = document.getElementById('copyTxBtn');
        var label = document.getElementById('copyTxLabel');
        if (!btn) return;
        btn.addEventListener('click', function() {
            var lines = document.querySelectorAll('#transcript [data-role]');
            if (!lines.length) return;
            var names = { user: 'You', assistant: 'CODEC', tool: 'Tool' };
            var out = [];
            lines.forEach(function(line) {
                var t = line.querySelector('.tx-text');
                var text = (t ? t.textContent : line.textContent).trim();
                var role = names[line.getAttribute('data-role')] || '';
                if (text) out.push((role ? '[' + role + '] ' : '') + text);
            });
            var payload = out.join('\n');
            var done = function() {
                btn.classList.add('copied');
                label.textContent = 'Copied';
                setTimeout(function() {
                    btn.classList.remove('copied');
                    label.textContent = 'Copy';
                }, 1500);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(payload).then(done).catch(function() {
                    // Fallback
                    var ta = document.createElement('textarea');
                    ta.value = payload;
                    document.body.appendChild(ta);
                    ta.select();
                    try { document.execCommand('copy'); done(); } catch(e) {}
                    document.body.removeChild(ta);
                });
            } else {
                var ta = document.createElement('textarea');
                ta.value = payload;
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); done(); } catch(e) {}
                document.body.removeChild(ta);
            }
        });
    })();

    /* ── Auto-connect via ?auto=1 ── */
    if (new URLSearchParams(location.search).get('auto') === '1') {
        window.addEventListener('load', function() { setTimeout(startCall, 400); });
    }
    // Apply UI preferences from dashboard settings
    (function(){try{var p=JSON.parse(_lsGet('codec-ui-prefs')||'{}'),m={'screenshot_btn':'#screenBtn','photo_btn':'#photoBtn','webcam_pip_btn':'#camBtn','voice_btn':'#voiceBtn','notif_bell':'#csInbox,#csTabInbox','voice_transcript':'.transcript-wrap','voice_actions':'#actionRow'};Object.keys(m).forEach(function(k){if(p[k]===false)m[k].split(',').forEach(function(s){document.querySelectorAll(s.trim()).forEach(function(el){el.style.display='none'})})})}catch(e){}})();
    </script>
<div class="webcam-pip" id="webcamPip">
  <img id="pipVideo" alt="Mac Webcam" onclick="expandPip()" style="cursor:pointer" />
  <div class="pip-bar">
    <button class="pip-btn snap-btn" onclick="snapFromPip()" title="Snapshot + Analyze"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg></button>
    <button class="pip-btn" onclick="savePipFrame()" title="Save photo"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg></button>
    <button class="pip-btn" onclick="expandPip()" title="Expand / Shrink"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
    <button class="pip-btn" onclick="closeWebcamPip()" title="Close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
</div>

<div class="modal-overlay" id="screenModal" onclick="closeScreenshot()">
  <button class="modal-close" onclick="closeScreenshot()" aria-label="Close screenshot"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <img id="screenImg" src="">
</div>
