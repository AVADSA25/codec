<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>/* Theme before first paint, so the page never flashes dark: same key and attribute as applyTheme() below. */try{(function(){function _lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}var t=_lsGet('codec-theme');if(t!=='light'&&t!=='dark'){try{t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}catch(e){t='dark'}}document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='light'?(m.getAttribute('data-light')||'#faf8f5'):'#121215'})()}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CODEC — Voice Call</title>
    <link rel="icon" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <link rel="stylesheet" href="/static/codec.css?v=78031f9b">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        :root {
          --bg: #121215; --surface: #1a1a1d; --surface-2: #212125; --surface-3: #2a2a2e;
          --border: #303035; --border-hover: #424248;
          --text: #ececec; --text-muted: #9a9aa0; --text-dim: #8b8b92;
          --accent: #d97757; --accent-hover: #e08766; --accent-dim: rgba(217,119,87,0.10); --on-accent: #121215;
          --danger: #ef4444; --success: #22c55e; --info: #3b82f6;
          --font: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
          --mono: 'IBM Plex Mono', 'SF Mono', monospace;
          --radius: 10px; --radius-sm: 6px;
          --bg2: #1a1a1d; --bg3: #212125; --bg4: #2a2a2e;
          --fg: #ececec; --fg2: #9a9aa0; --fg3: #8b8b92;
          --ac: #d97757; --bd: #303035;
          --tx: #ececec; --tx2: #9a9aa0;
          --ft: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
          --mn: 'IBM Plex Mono', 'SF Mono', monospace;
          --dn: #ef4444;
          --accent2: #ff9a4d; --accent-bg: rgba(217,119,87,0.10);
          --safe-top: env(safe-area-inset-top, 0px);
          --safe-bottom: env(safe-area-inset-bottom, 0px);
          /* Voice-specific */
          --green: #66bb6a;
          --blue: #40c4ff;
        }

        /* ── Light mode ── */
        [data-theme="light"] {
          --bg: #f7f5f2; --surface: #fff; --surface-2: #f0ece6; --surface-3: #e8e4de;
          --border: #d5d0ca; --border-hover: #bbb;
          --text: #1a1a1a; --text-muted: #555; --text-dim: #777;
          --accent: #b85a3a; --accent-hover: #a04d31; --accent-dim: rgba(184,90,58,0.08); --on-accent: #ffffff;
          --ac: #b85a3a; --accent-bg: rgba(184,90,58,0.08);
          /* Override voice-specific vars */
          --bg2: #fff; --bd: #d5d0ca; --tx: #1a1a1a; --tx2: #555;
        }
        [data-theme="light"] body::before { background: radial-gradient(ellipse 60% 60% at 50% 50%, rgba(217,119,87,0.06) 0%, transparent 70%); }
        [data-theme="light"] .avatar-core { background: #f0ece6; border-color: #d5d0ca; }
        [data-theme="light"] .transcript { background: #fff; border-color: #d5d0ca; }
        [data-theme="light"] .transcript-header { border-color: #d5d0ca; }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--tx);
            position: relative;
        }
        /* The shell (static/codec-shell.js) makes body a 100dvh column; the call is its .cs-main. */
        .call-container.cs-main { overflow-y: auto; }

        /* Ambient background glow — reacts to state */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 60% 60% at 50% 50%, rgba(217,119,87,0.04) 0%, transparent 70%);
            transition: all 1s ease;
            pointer-events: none;
        }
        body.state-listening::before { background: radial-gradient(ellipse 60% 60% at 50% 50%, rgba(0,230,118,0.05) 0%, transparent 70%); }
        body.state-speaking::before  { background: radial-gradient(ellipse 70% 70% at 50% 50%, rgba(217,119,87,0.08) 0%, transparent 70%); }
        body.state-processing::before { background: radial-gradient(ellipse 60% 60% at 50% 50%, rgba(64,196,255,0.06) 0%, transparent 70%); }
        body.state-analyzing_screen::before { background: radial-gradient(ellipse 65% 65% at 50% 50%, rgba(168,85,247,0.08) 0%, transparent 70%); }


        /* ── Scrollbar ── */
        * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* Main layout */
        .call-container {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 36px;
            max-width: 600px; width: 100%; padding: 32px;
            margin: 0 auto;
        }

        /* ── Avatar ring ── */
        .avatar-wrap {
            position: relative;
            width: 240px; height: 240px;
        }

        .ring-outer {
            position: absolute; inset: 0;
            border-radius: 50%;
            border: 1.5px solid rgba(217,119,87,0.25);
            animation: spin-slow 8s linear infinite;
        }
        .ring-outer::after {
            content: '';
            position: absolute;
            top: -2px; left: 50%;
            width: 6px; height: 6px;
            margin-left: -3px;
            border-radius: 50%;
            background: var(--ac);
            box-shadow: 0 0 8px 2px var(--ac);
        }
        @keyframes spin-slow { 100% { transform: rotate(360deg); } }

        .ring-inner {
            position: absolute; inset: 16px;
            border-radius: 50%;
            border: 1px solid var(--bd);
            transition: border-color 0.4s, box-shadow 0.4s;
        }
        .state-listening .ring-inner {
            border-color: rgba(0,230,118,0.5);
            box-shadow: 0 0 20px rgba(0,230,118,0.15);
            animation: pulse-green 1.5s ease-in-out infinite;
        }
        .state-speaking .ring-inner {
            border-color: rgba(217,119,87,0.7);
            box-shadow: 0 0 24px rgba(217,119,87,0.25);
            animation: pulse-orange 0.6s ease-in-out infinite;
        }
        .state-processing .ring-inner {
            border-color: rgba(64,196,255,0.6);
            box-shadow: 0 0 20px rgba(64,196,255,0.15);
        }
        .state-analyzing_screen .ring-inner {
            border-color: rgba(168,85,247,0.7);
            box-shadow: 0 0 24px rgba(168,85,247,0.25);
            animation: pulse-purple 1.0s ease-in-out infinite;
        }
        @keyframes pulse-green {
            0%,100% { transform: scale(1); opacity:0.7; }
            50%      { transform: scale(1.04); opacity:1; }
        }
        @keyframes pulse-orange {
            0%,100% { transform: scale(1); opacity:0.8; }
            50%      { transform: scale(1.06); opacity:1; }
        }
        @keyframes pulse-purple {
            0%,100% { transform: scale(1); opacity:0.7; }
            50%      { transform: scale(1.08); opacity:1; }
        }

        /* ── Live mic energy ring — driven by JS in onaudioprocess ── */
        .ring-energy {
            position: absolute; inset: 4px;
            border-radius: 50%;
            border: 2px solid transparent;
            pointer-events: none;
            transition: transform 0.06s ease-out, box-shadow 0.06s ease-out, border-color 0.06s ease-out;
            will-change: transform, box-shadow;
        }
        .state-listening .ring-energy {
            border-color: rgba(0,230,118,0.35);
        }

        .avatar-core {
            position: absolute; inset: 32px;
            border-radius: 50%;
            background: var(--bg2);
            border: 1px solid var(--bd);
            display: flex; align-items: center; justify-content: center;
            user-select: none;
            overflow: hidden;
        }
        .avatar-core img {
            width: 60%; height: 60%; object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(217,119,87,0.4));
            transition: filter 0.4s;
        }
        .state-listening .avatar-core img { filter: drop-shadow(0 0 16px rgba(0,230,118,0.5)); }
        .state-speaking .avatar-core img { filter: drop-shadow(0 0 20px rgba(217,119,87,0.6)); }
        .state-processing .avatar-core img { filter: drop-shadow(0 0 16px rgba(64,196,255,0.5)); }
        .state-analyzing_screen .avatar-core img { filter: drop-shadow(0 0 20px rgba(168,85,247,0.6)); }

        /* Waveform bars (shown while Q is speaking) */
        .waveform {
            position: absolute; bottom: 24px;
            left: 50%; transform: translateX(-50%);
            display: flex; gap: 3px; align-items: flex-end;
            height: 20px; opacity: 0;
            transition: opacity 0.3s;
        }
        .state-speaking .waveform { opacity: 1; }
        .waveform .bar {
            width: 3px; background: var(--ac); border-radius: 2px;
            animation: wave 0.8s ease-in-out infinite;
        }
        .waveform .bar:nth-child(1) { animation-delay: 0s;    height: 10px;  }
        .waveform .bar:nth-child(2) { animation-delay: 0.1s;  height: 18px; }
        .waveform .bar:nth-child(3) { animation-delay: 0.2s;  height: 26px; }
        .waveform .bar:nth-child(4) { animation-delay: 0.15s; height: 18px; }
        .waveform .bar:nth-child(5) { animation-delay: 0.05s; height: 10px;  }
        @keyframes wave {
            0%,100% { transform: scaleY(1); }
            50%      { transform: scaleY(1.8); }
        }

        /* Timer */
        .timer {
            font-size: calc(28px * var(--fs-scale)); font-weight: 300;
            color: var(--tx2); letter-spacing: 0.08em;
            font-variant-numeric: tabular-nums;
            min-height: 28px;
            font-family: 'SF Mono', 'Menlo', monospace;
        }

        /* Status label */
        .status {
            font-size: var(--fs-16); color: var(--tx2);
            text-align: center; letter-spacing: 0.04em;
            min-height: 18px; transition: color 0.3s;
        }
        .state-listening .status  { color: var(--green); }
        .state-speaking  .status  { color: var(--ac); }
        .state-processing .status { color: var(--blue); }
        .state-analyzing_screen .status { color: #a855f7; }

        /* Speak-to-interrupt hint */
        .interrupt-hint {
            font-size: var(--fs-12); color: var(--text-dim); text-align: center;
            letter-spacing: 0.05em; min-height: 14px; opacity: 0;
            transition: opacity 0.3s; margin-top: 2px;
        }
        .state-speaking .interrupt-hint,
        .state-processing .interrupt-hint,
        .state-analyzing_screen .interrupt-hint { opacity: 1; }

        /* Call button */
        .call-btn {
            width: 72px; height: 72px; border-radius: 50%;
            border: none; cursor: pointer; font-size: calc(22px * var(--fs-scale));
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.15s, box-shadow 0.2s;
            position: relative; z-index: 1;
        }
        .call-btn::after {
            content: ''; position: absolute; inset: -3px;
            border-radius: 50%; border: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .call-btn.start {
            background: linear-gradient(135deg, #00aa55, #00cc66);
            box-shadow: 0 4px 20px rgba(0,170,85,0.35);
        }
        .call-btn.start:hover  { transform: scale(1.07); box-shadow: 0 6px 28px rgba(0,170,85,0.5); }
        .call-btn.end {
            background: linear-gradient(135deg, #cc2222, #ff3b3b);
            box-shadow: 0 4px 20px rgba(255,59,59,0.35);
        }
        .call-btn.end:hover    { transform: scale(1.07); box-shadow: 0 6px 28px rgba(255,59,59,0.5); }
        .call-btn:active       { transform: scale(0.95); }

        /* ── Action buttons row ── */
        .action-row {
            display: flex; gap: 12px; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        body.state-listening .action-row,
        body.state-processing .action-row,
        body.state-speaking .action-row,
        body.state-analyzing_screen .action-row { opacity: 1; pointer-events: auto; }

        .action-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 18px; border-radius: 20px;
            border: 1px solid var(--border); background: var(--surface-2);
            color: var(--text-muted); font-size: var(--fs-13); font-weight: 500;
            cursor: pointer; transition: all 0.15s; font-family: var(--font);
            -webkit-tap-highlight-color: transparent;
        }
        .action-btn:hover { border-color: var(--border-hover); color: var(--text); background: var(--surface-3); }
        .action-btn:active { transform: scale(0.95); }
        .action-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .action-btn.your-turn { border-color: var(--green); color: var(--green); }
        .action-btn.your-turn:hover { background: rgba(102,187,106,0.1); }
        body.state-speaking .action-btn.your-turn,
        body.state-processing .action-btn.your-turn { opacity: 0.3; pointer-events: none; }

        .action-btn.nudge { display: none; }
        body.state-processing .action-btn.nudge { display: flex; border-color: var(--blue); color: var(--blue); }
        .action-btn.nudge:hover { background: rgba(64,196,255,0.1); }

        /* Hold-to-talk indicator */
        .hold-indicator {
            position: absolute; inset: 0; border-radius: 50%;
            background: rgba(102,187,106,0.08);
            border: 2px solid var(--green);
            opacity: 0; transform: scale(0.95);
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
        }
        .hold-indicator.active { opacity: 1; transform: scale(1); }

        /* Transcript */
        .transcript-wrap {
            width: 100%; background: var(--bg2);
            border: 1px solid var(--bd); border-radius: 14px;
            overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            max-width: 540px;
        }
        .transcript-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--bd);
            font-size: var(--fs-12); font-weight: 600;
            letter-spacing: 0.1em; color: var(--tx2);
            font-family: 'SF Mono', monospace;
            display: flex; justify-content: space-between; align-items: center;
        }
        .tx-copy-btn {
            display: flex; align-items: center; gap: 5px;
            padding: 4px 9px; font-size: var(--fs-12); font-weight: 600;
            letter-spacing: 0.08em; color: var(--tx2);
            background: transparent; border: 1px solid var(--bd); border-radius: 6px;
            cursor: pointer; font-family: 'SF Mono', monospace;
            transition: all 0.15s ease;
        }
        .tx-copy-btn:hover { color: var(--ac); border-color: var(--ac); }
        .tx-copy-btn.copied { color: var(--green); border-color: var(--green); }
        .tx-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--bd); }
        .state-listening  .tx-dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
        .state-speaking   .tx-dot { background: var(--ac);    box-shadow: 0 0 6px var(--ac); }
        .state-processing .tx-dot { background: var(--blue);  box-shadow: 0 0 6px var(--blue); }
        .state-analyzing_screen .tx-dot { background: #a855f7; box-shadow: 0 0 6px #a855f7; }

        .transcript {
            max-height: 300px; overflow-y: auto;
            padding: 16px 20px; font-size: calc(15px * var(--fs-scale)); line-height: 1.7;
            scrollbar-width: thin; scrollbar-color: var(--bd) transparent;
        }
        .transcript::-webkit-scrollbar       { width: 4px; }
        .transcript::-webkit-scrollbar-track { background: transparent; }
        .transcript::-webkit-scrollbar-thumb { background: var(--bd); border-radius: 2px; }

        .tx-line { margin-bottom: 8px; animation: fadeIn 0.2s ease; }
        .tx-line:last-child { margin-bottom: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

        .tx-line.user      { color: var(--ac); }
        .tx-line.assistant { color: var(--green); }
        .tx-line.system    { color: var(--tx2); font-style: italic; font-size: var(--fs-13); }
        .tx-label { font-weight: 700; margin-right: 6px; font-size: var(--fs-12); letter-spacing: 0.05em; }

        /* Streaming cursor */
        .cursor { display: inline-block; width: 2px; height: 12px;
                  background: var(--green); margin-left: 2px;
                  animation: blink 0.7s step-end infinite; vertical-align: middle; }
        @keyframes blink { 50% { opacity: 0; } }

        /* ── Mobile Responsive ── */
        @media (max-width: 768px) {
          .avatar-wrap { width: 180px; height: 180px; }
          .avatar-core { inset: 26px; }
          .call-container { gap: 24px; padding: 20px; }
          .transcript-wrap { width: 100%; }
          .transcript { max-height: 160px; }
          .call-btn { width: 64px; height: 64px; }
          .timer { font-size: var(--fs-24); }
        }
        @media (max-width: 480px) {
          .avatar-wrap { width: 150px; height: 150px; }
          .avatar-core { inset: 22px; }
          .ring-inner { inset: 12px; }
          .timer { font-size: var(--fs-20); }
          .call-container { gap: 20px; }
          .call-btn { width: 56px; height: 56px; }
        }
        .webcam-pip{position:fixed;bottom:80px;right:20px;width:240px;border-radius:14px;overflow:hidden;border:2px solid var(--accent);box-shadow:0 4px 24px rgba(0,0,0,.5);z-index:9999;display:none;background:#000;transition:width .3s,height .3s,border-radius .3s}
        .webcam-pip img,.webcam-pip video{width:100%;display:block}
        .webcam-pip.expanded{width:640px;max-width:90vw;border-radius:10px}
        .pip-bar{display:flex;justify-content:center;gap:10px;padding:6px;background:rgba(0,0,0,.6)}
        .pip-btn{background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
        .pip-btn:hover{background:var(--accent)}
        .pip-btn.snap-btn{background:rgba(255,80,80,.7)}
        .pip-btn.snap-btn:hover{background:#e33}
        /* ── Screenshot/Photo Modal ── */
        .modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); z-index:100; justify-content:center; align-items:center; padding:20px; }
        .modal-overlay.show { display:flex; }
        .modal-overlay img { max-width:100%; max-height:90vh; border-radius:var(--radius); border:1px solid var(--border); }
        .modal-close { position:fixed; top:16px; right:16px; background:var(--surface); color:var(--text); border:1px solid var(--border); width:32px; height:32px; border-radius:50%; font-size:calc(18px * var(--fs-scale)); cursor:pointer; z-index:101; display:flex; align-items:center; justify-content:center; }
        /* ── Voice mode pills (flash / default / think) ── */
        .mode-row { display:flex; gap:8px; justify-content:center; margin:10px 0 2px; }
        .mode-pill {
            background:var(--surface-2,#1f1f22); border:1px solid var(--border,#2a2a2f);
            color:var(--text-dim,#6a6a70); font-size:var(--fs-12); font-weight:700;
            letter-spacing:1px; padding:5px 14px; border-radius:999px; cursor:pointer;
            transition:all .15s; text-transform:uppercase;
        }
        .mode-pill:hover { color:var(--text,#ececec); border-color:var(--border-hover,#3a3a40); }
        .mode-pill.active {
            color:var(--on-accent); background:var(--accent,#d97757); border-color:var(--accent,#d97757);
            box-shadow:0 0 12px rgba(217,119,87,.35);
        }
        .mode-pill.think.active { box-shadow:0 0 12px rgba(217,119,87,.5); }
    </style>
</head>
<body id="body">
<script src="/static/codec-shell.js?v=d03f5d95" data-page="voice" data-title="Voice" data-status></script>
    <div class="call-container cs-main">

        <!-- Avatar (tap-and-hold for push-to-talk) -->
        <div class="avatar-wrap" id="avatarWrap">
            <div class="ring-outer"></div>
            <div class="ring-inner"></div>
            <div class="ring-energy" id="ringEnergy"></div>
            <div class="hold-indicator" id="holdIndicator"></div>
            <div class="avatar-core"><img src="/static/logo.svg" alt="CODEC"></div>
            <div class="waveform">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div>
            </div>
        </div>

        <div class="timer" id="timer"></div>
        <div class="status" id="statusLabel">Tap to start voice call</div>
        <div class="interrupt-hint" id="interruptHint"></div>

        <!-- Voice mode: flash / default / think (docs/VOICE-MODES-DESIGN.md) -->
        <div class="mode-row" id="modeRow">
            <button class="mode-pill" id="modeFlash" onclick="setVoiceMode('flash')" title="Fastest replies — trimmed context, one-sentence answers"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>Flash</button>
            <button class="mode-pill active" id="modeDefault" onclick="setVoiceMode('default')" title="Standard voice chat">Normal</button>
            <button class="mode-pill think" id="modeThink" onclick="setVoiceMode('think')" title="Live tool calling — lights, music, web, calendar, email — with spoken progress"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M12 2C9 2 6.5 4 6 7c-2 .5-4 3-4 5.5C2 15 4 17 6.5 17H7v2a2 2 0 002 2h6a2 2 0 002-2v-2h.5C20 17 22 15 22 12.5 22 10 20 7.5 18 7c-.5-3-3-5-6-5z"/></svg>Think</button>
        </div>

        <!-- Action row: your turn + nudge -->
        <div class="action-row" id="actionRow">
            <button class="action-btn your-turn" id="yourTurnBtn" onclick="sendYourTurn()">
                <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
                Your Turn
            </button>
            <button class="action-btn nudge" id="nudgeBtn" onclick="sendNudge()">

    /* ── State ── */
    var ws          = null;

    var mediaStream = null;

    var timerIv     = null;
    var callStart   = 0;

    /* ── Audio playback queue ── */
    var audioQueue  = [];
    var isPlaying   = false;
    var curSource   = null;

    /* ── Interrupt detection ── */
    var INTERRUPT_RMS   = 800;   // mic RMS threshold to trigger interrupt
    var lastInterruptAt = 0;     // debounce — ms timestamp

    /* ── Streaming transcript ── */
    var streamLine  = null;
    var streamText  = "";

    var processingStart = 0;
    var processingTmr   = null;

    /* ── UI helpers ── */
    function setState(s) {
        var body = document.getElementById('body');
        Array.prototype.slice.call(body.classList).forEach(function(c){ if (c.indexOf('state-') === 0) body.classList.remove(c); });
        body.classList.add('state-' + s);
        var el = document.getElementById('statusLabel');
        // Clear processing timer on state change
        if (processingTmr && s !== 'processing') {
            clearInterval(processingTmr); processingTmr = null;
        }
        if (s === 'idle')       el.textContent = '';
        else if (s === 'listening')  el.textContent = 'Listening — tap "Your Turn" when done';
        else if (s === 'speaking')   el.textContent = 'Speaking…';
        else if (s === 'analyzing_screen') el.textContent = 'Analyzing your screen…';
        else if (s === 'processing') {
            processingStart = Date.now();
            el.textContent = 'Transcribing…';
            processingTmr = setInterval(function() {
                var sec = Math.floor((Date.now() - processingStart) / 1000);
                if (sec < 3)      el.textContent = 'Transcribing…';
                else if (sec < 8) el.textContent = 'Thinking… ' + sec + 's';
                else              el.textContent = 'Still working… ' + sec + 's';
            }, 500);
        }
    }

    function addTranscript(role, text) {
        var el = document.getElementById('transcript');
        var label = role === 'user' ? 'M' : role === 'assistant' ? 'CODEC' : 'SYS';
        /* Assistant final: replace streaming line instead of adding a duplicate */
        if (role === 'assistant' && streamLine) {
            var cur = streamLine.querySelector('.cursor');
            if (cur) cur.remove();
            streamLine.innerHTML = '<span class="tx-label">' + label + '</span>' + escHtml(text);
            streamLine = null; streamText = '';
            el.scrollTop = el.scrollHeight;
            return;
        }
        if (streamLine) { streamLine.querySelector('.cursor').remove(); streamLine = null; streamText = ''; }
        var div = document.createElement('div');
        div.className = 'tx-line ' + role;
        div.innerHTML = '<span class="tx-label">' + label + '</span>' + escHtml(text);
        el.appendChild(div);
        el.scrollTop = el.scrollHeight;
    }

    function appendStreamChunk(chunk) {
        var el = document.getElementById('transcript');
        if (!streamLine) {
            streamLine = document.createElement('div');
            streamLine.className = 'tx-line assistant';
            streamLine.innerHTML = '<span class="tx-label">CODEC</span>';
            el.appendChild(streamLine);
        }
        /* Remove cursor, append text, re-add cursor */
        var cur = streamLine.querySelector('.cursor');
        if (cur) cur.remove();
        streamText += escHtml(chunk);
        streamLine.innerHTML = '<span class="tx-label">CODEC</span>' + streamText + '<span class="cursor"></span>';
        el.scrollTop = el.scrollHeight;
    }

    function escHtml(s) {
        return String(s)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    /* ── Audio playback ── */
    async function playNext() {
        if (!audioQueue.length) {
            isPlaying = false;
            if (isInCall) setState('listening');
            return;
        }
        isPlaying = true;
        setState('speaking');
        var data = audioQueue.shift();
        try {
            /* slice to detach, then decode */
            var buf = await audioCtx.decodeAudioData(data.slice(0));
            var src = audioCtx.createBufferSource();
            src.buffer = buf;
            src.connect(audioCtx.destination);
            src.onended = function() { curSource = null; playNext(); };
            src.start();
            curSource = src;
        } catch(e) {
            console.warn('[Voice] Decode error:', e);
            playNext();
        }
    }

    function queueAudio(data) {
        /* Dedup guard: skip if last queued chunk is identical (same bytes) */
        if (audioQueue.length > 0) {
            var last = audioQueue[audioQueue.length - 1];
            if (last.byteLength === data.byteLength) {

                for (var i = 0; i < a.length; i += 64) { if (a[i] !== b[i]) { dup = false; break; } }
                if (dup) { console.log('[Voice] Duplicate audio chunk skipped'); return; }
            }
        }
        audioQueue.push(data);
        if (!isPlaying) playNext();
    }

    function stopAudio() {
        audioQueue = [];
        isPlaying  = false;
        if (curSource) { try { curSource.stop(); } catch(e){} curSource = null; }
    }

    /* ── WebSocket with auto-reconnect ── */
    var wsRetryCount = 0;
    var wsRetryMax   = 5;
    var wsRetryDelay = 1000; /* starts at 1s, doubles each retry, max 30s */
    var wsRetryTimer = null;
    var wsIntentionalClose = false;
    var wsPingTimer  = null;
    var wsSessionId  = null; /* server-assigned session ID for resume */

    function connectWS() {
        wsIntentionalClose = false;
        var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        var url = proto + '//' + location.host + '/ws/voice';
        /* If we have a session ID from a previous connection, always request resume */
        if (wsSessionId) {
            url += '?resume=' + encodeURIComponent(wsSessionId);
        }
        ws = new WebSocket(url);
        ws.binaryType = 'arraybuffer';

        ws.onopen = function() {
            wsRetryCount = 0;
            wsRetryDelay = 1000;
            setState('listening');
            startMic();
            /* Ping every 8s to detect stale connections */
            if (wsPingTimer) clearInterval(wsPingTimer);
            wsPingTimer = setInterval(function() {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    try { ws.send(JSON.stringify({type: 'ping'})); } catch(e) {}
                }

        };

        ws.onmessage = function(e) {
            if (e.data instanceof ArrayBuffer) {
                queueAudio(e.data);
            } else {
                try {
                    var msg = JSON.parse(e.data);
                    if (msg.type === 'pong') return; /* heartbeat response */
                    if (msg.type === 'session') {
                        /* Store session ID so we can resume on reconnect */
                        wsSessionId = msg.session_id;
                        return;
                    }
                    if (msg.type === 'reconnect') {
                        /* Server is about to close — save session ID for resume */
                        if (msg.session_id) wsSessionId = msg.session_id;
                        console.log('[Voice] Server sent reconnect advisory:', msg.reason);
                        return;
                    }
                    if (msg.type === 'transcript') {
                        addTranscript(msg.role, msg.text);
                    } else if (msg.type === 'transcript_chunk') {
                        appendStreamChunk(msg.text);
                    } else if (msg.type === 'hint') {
                        var hint = document.getElementById('interruptHint');
                        if (hint) hint.textContent = msg.text || '';
                    } else if (msg.type === 'mode') {
                        updateModePills(msg.mode);
                    } else if (msg.type === 'status') {
                        if (msg.status === 'processing') setState('processing');
                        else if (msg.status === 'analyzing_screen') setState('analyzing_screen');
                        else if (msg.status === 'tool_running') {
                            setState('processing');
                            var sl = document.getElementById('statusLabel');
                            if (sl) sl.textContent = 'Running tools…';
                        }
                        else if (msg.status === 'listening') {
                            if (!isPlaying) setState('listening');
                            var hint = document.getElementById('interruptHint');
                            if (hint) hint.textContent = '';
                        }
                    }
                } catch(err) {}
            }
        };

        window.addEventListener('beforeunload', function() {
            wsIntentionalClose = true;
            if (ws && ws.readyState === WebSocket.OPEN) { try { ws.close(); } catch(e) {} }
            stopMic();
        });

        ws.onclose = function() {
            if (wsPingTimer) { clearInterval(wsPingTimer); wsPingTimer = null; }
            if (wsIntentionalClose) {
                addTranscript('system', 'Disconnected — transcript saved to memory');
                return;
            }
            /* Unexpected disconnect — try to reconnect */
            if (isInCall && wsRetryCount < wsRetryMax) {
                wsRetryCount++;
                var delay = Math.min(wsRetryDelay, 30000);
                addTranscript('system', 'Connection lost — reconnecting in ' + Math.round(delay/1000) + 's... (attempt ' + wsRetryCount + '/' + wsRetryMax + ')');
                setState('processing');
                stopMic();
                wsRetryTimer = setTimeout(function() {
                    if (isInCall) connectWS();
                }, delay);
                wsRetryDelay *= 2;
            } else if (isInCall) {
                addTranscript('system', 'Connection lost — could not reconnect after ' + wsRetryMax + ' attempts');
                endCall();
            }
        };

        ws.onerror = function(e) {
            console.error('[Voice] WS error:', e);
        };
    }

    /* ── Microphone ── */
    async function startMic() {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            mediaStream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    sampleRate: 16000, channelCount: 1,
                    echoCancellation: true, noiseSuppression: true,
                    autoGainControl: true
                }
            });
            var source = audioCtx.createMediaStreamSource(mediaStream);
            /* 4096-sample chunks ~= 256 ms at 16 kHz */
            processor = audioCtx.createScriptProcessor(4096, 1, 1);
            processor.onaudioprocess = function(e) {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;
                var f32 = e.inputBuffer.getChannelData(0);

                /* ── Always compute RMS for energy ring + interrupt ── */
                var sum = 0;
                for (var j = 0; j < f32.length; j++) sum += f32[j] * f32[j];
                var rms = Math.sqrt(sum / f32.length) * 32768;

                /* ── Energy ring: scales ring border + glow with mic input ── */
                var re = document.getElementById('ringEnergy');
                if (re) {
                    var bodyClass = document.getElementById('body').className;
                    if (bodyClass.indexOf('state-listening') >= 0) {
                        var lvl  = Math.min(rms / 2800, 1.0);
                        var sc   = (1 + lvl * 0.13).toFixed(3);
                        var glow = Math.round(lvl * 22);
                        var op   = (0.25 + lvl * 0.6).toFixed(2);
                        re.style.transform   = 'scale(' + sc + ')';
                        re.style.boxShadow   = '0 0 ' + glow + 'px rgba(0,230,118,' + op + ')';
                        re.style.borderColor = 'rgba(0,230,118,' + op + ')';
                    } else {
                        re.style.transform   = '';
                        re.style.boxShadow   = '';
                        re.style.borderColor = '';
                    }
                }

                /* ── Interrupt detection: if Q is speaking and user talks ── */
                if (isPlaying) {
                    var now = Date.now();
                    if (rms > INTERRUPT_RMS && (now - lastInterruptAt) > 1200) {
                        lastInterruptAt = now;
                        ws.send(JSON.stringify({ type: 'interrupt' }));
                        stopAudio();
                        setState('listening');
                        console.log('[Voice] Interrupt sent — rms=' + Math.round(rms));
                    }
                }

                var i16 = new Int16Array(f32.length);
                for (var i = 0; i < f32.length; i++) {
                    var s = Math.max(-1, Math.min(1, f32[i]));
                    i16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                ws.send(i16.buffer);
            };
            source.connect(processor);
            processor.connect(audioCtx.destination);
        } catch(e) {
            addTranscript('system', 'Microphone error: ' + e.message);
        }
    }

    function stopMic() {
        if (processor)    { processor.disconnect();  processor    = null; }
        if (mediaStream)  { mediaStream.getTracks().forEach(function(t){ t.stop(); }); mediaStream = null; }
        if (audioCtx)     { audioCtx.close();         audioCtx     = null; }
    }

    /* ── Call control ── */
    function toggleCall() {
        if (isInCall) endCall(); else startCall();
    }

    function startCall() {
        isInCall   = true;
        callStart  = Date.now();
        var btn    = document.getElementById('callBtn');
        btn.className = 'call-btn end';
        btn.innerHTML = '<svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z" transform="rotate(135 12 12)"/></svg>';
        timerIv = setInterval(updateTimer, 1000);
        document.getElementById('timer').textContent = '00:00';
        document.getElementById('transcript').innerHTML = '<div class="tx-line system"><span class="tx-label">SYS</span>Connecting…</div>';
        setState('processing');
        connectWS();
    }

    function endCall() {
        isInCall = false;
        var btn = document.getElementById('callBtn');
        btn.className = 'call-btn start';
        btn.innerHTML = '<svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>';
        if (timerIv) { clearInterval(timerIv); timerIv = null; }
        stopAudio();
        stopMic();
        if (wsRetryTimer) { clearTimeout(wsRetryTimer); wsRetryTimer = null; }
        if (wsPingTimer)  { clearInterval(wsPingTimer);  wsPingTimer  = null; }
        wsIntentionalClose = true;
        if (ws) {
            try { ws.send(JSON.stringify({type: 'end_call'})); } catch(e) {}
            try { ws.close(); } catch(e){}
            ws = null;
        }
        wsSessionId = null; /* clear session — no resume after intentional end */
        setState('idle');
        document.getElementById('statusLabel').textContent = 'Call ended — transcript saved to memory';
    }

    function updateTimer() {
        var s = Math.floor((Date.now() - callStart) / 1000);
        document.getElementById('timer').textContent =
            String(Math.floor(s / 60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0');
    }

    /* ── "Your Turn" — force-send current audio buffer as utterance ── */
    /* ── Voice modes (flash / default / think) ── */
    var voiceMode = 'default';
    function updateModePills(m) {
        voiceMode = m || 'default';
        var ids = { flash: 'modeFlash', 'default': 'modeDefault', think: 'modeThink' };
        Object.keys(ids).forEach(function(k) {
            var el = document.getElementById(ids[k]);
            if (el) el.classList.toggle('active', k === voiceMode);
        });
    }
    function setVoiceMode(m) {
        updateModePills(m);  /* optimistic — server ack confirms */
        if (ws && ws.readyState === WebSocket.OPEN) {
            try { ws.send(JSON.stringify({ type: 'mode', mode: m })); } catch (e) {}
        }
    }

    function sendYourTurn() {
        if (!ws || ws.readyState !== WebSocket.OPEN || !isInCall) return;
        ws.send(JSON.stringify({ type: 'your_turn' }));
        setState('processing');
        document.getElementById('statusLabel').textContent = 'Got it — processing…';
        // Brief haptic feedback on mobile
        if (navigator.vibrate) navigator.vibrate(30);
    }

    /* ── Nudge — poke the AI when processing seems stuck ── */
    function sendNudge() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ type: 'nudge' }));
        document.getElementById('statusLabel').textContent = 'Nudged — hang on…';
        if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
    }

    /* ── Hold-to-talk on avatar ── */
    (function() {
        var avatar = document.getElementById('avatarWrap');
        var holdEl = document.getElementById('holdIndicator');
        var holdTimer = null;
        var isHolding = false;

        function startHold(e) {
            if (!isInCall) return;
            e.preventDefault();
            holdTimer = setTimeout(function() {
                isHolding = true;
                holdEl.classList.add('active');
                // Unmute / signal "user speaking" to server
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'hold_start' }));
                }
                if (navigator.vibrate) navigator.vibrate(15);
            }, 200); // 200ms threshold to distinguish tap from hold
        }

        function endHold(e) {
            if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
            if (!isHolding) return;
            isHolding = false;
            holdEl.classList.remove('active');
            // Signal "done talking" — force send
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'your_turn' }));
            }
            setState('processing');
        }

        avatar.addEventListener('touchstart', startHold, { passive: false });
        avatar.addEventListener('touchend', endHold);
        avatar.addEventListener('touchcancel', endHold);
        avatar.addEventListener('mousedown', startHold);
        avatar.addEventListener('mouseup', endHold);
        avatar.addEventListener('mouseleave', endHold);
    })();

    /* ── Copy transcript button ── */
    (function() {
        var btn = document.getElementById('copyTxBtn');
        var label = document.getElementById('copyTxLabel');
        if (!btn) return;
        btn.addEventListener('click', function() {
            var lines = document.querySelectorAll('#transcript .tx-line');
            if (!lines.length) return;
            var out = [];
            lines.forEach(function(line) {
                var roleEl = line.querySelector('.tx-label');
                var role = roleEl ? roleEl.textContent.trim() : '';
                var text = line.textContent.replace(role, '').trim();
                if (text) out.push((role ? '[' + role + '] ' : '') + text);
            });
            var payload = out.join('\n');
            var done = function() {
                btn.classList.add('copied');
                label.textContent = 'COPIED';
                setTimeout(function() {
                    btn.classList.remove('copied');
                    label.textContent = 'COPY';
                }, 1500);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(payload).then(done).catch(function() {
                    // Fallback
                    var ta = document.createElement('textarea');
                    ta.value = payload;
                    document.body.appendChild(ta);
                    ta.select();
                    try { document.execCommand('copy'); done(); } catch(e) {}
                    document.body.removeChild(ta);
                });
            } else {
                var ta = document.createElement('textarea');
                ta.value = payload;
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); done(); } catch(e) {}
                document.body.removeChild(ta);
            }
        });
    })();

    /* ── Auto-connect via ?auto=1 ── */
    if (new URLSearchParams(location.search).get('auto') === '1') {
        window.addEventListener('load', function() { setTimeout(startCall, 400); });
    }
    // Apply UI preferences from dashboard settings
    (function(){try{var p=JSON.parse(_lsGet('codec-ui-prefs')||'{}'),m={'screenshot_btn':'#screenBtn','photo_btn':'#photoBtn','webcam_pip_btn':'#camBtn','voice_btn':'#voiceBtn','notif_bell':'#csInbox,#csTabInbox','voice_transcript':'.transcript-wrap','voice_actions':'#actionRow'};Object.keys(m).forEach(function(k){if(p[k]===false)m[k].split(',').forEach(function(s){document.querySelectorAll(s.trim()).forEach(function(el){el.style.display='none'})})})}catch(e){}})();
    </script>
<div class="webcam-pip" id="webcamPip">
  <img id="pipVideo" alt="Mac Webcam" onclick="expandPip()" style="cursor:pointer" />
  <div class="pip-bar">
    <button class="pip-btn snap-btn" onclick="snapFromPip()" title="Snapshot + Analyze"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg></button>
    <button class="pip-btn" onclick="savePipFrame()" title="Save photo"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg></button>
    <button class="pip-btn" onclick="expandPip()" title="Expand / Shrink"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
    <button class="pip-btn" onclick="closeWebcamPip()" title="Close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
</div>

  <button class="modal-close" onclick="closeScreenshot()" aria-label="Close screenshot"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
