<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#121215">
<script>/* Theme before first paint, so the page never flashes dark: same key and attribute as applyTheme() below. */try{(function(){function _lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}var t=_lsGet('codec-theme');if(t!=='light'&&t!=='dark'){try{t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}catch(e){t='dark'}}document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='light'?(m.getAttribute('data-light')||'#faf8f5'):'#121215'})()}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>CODEC Deep Chat</title>
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/static/codec.css?v=78031f9b">
<style>
:root {
  --bg: #121215; --surface: #18181b; --surface-2: #1f1f22; --surface-3: #27272a;
  --border: #2a2a2f; --border-strong: #3a3a40;
  --text: #ececec; --text-muted: #9a9aa0; --text-dim: #8b8b92;
  /* 2026 refresh: keep CODEC orange identity but warmer + calmer (was pure #E8711A) */
  --accent: #d97757; --accent-hover: #e08766; --accent-dim: rgba(217,119,87,0.10); --on-accent: #121215;
  --danger: #ef4444; --success: #22c55e; --warning: #f59e0b; --info: #60a5fa;
  /* Muted sage green for agent "running" states — pairs with the warm orange theme instead of the harsh bright green */
  --running: #4f9a7d; --blocked: #d98a5a;
  --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'IBM Plex Mono', 'SF Mono', monospace;
  --radius-sm: 6px; --radius: 10px; --radius-lg: 14px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
[data-theme=light]{--bg:#faf8f5;--surface:#fff;--surface-2:#f2eee8;--surface-3:#ebe6df;--border:#e2ddd5;--border-strong:#c8c2b8;--text:#18181b;--text-muted:#52525b;--text-dim:#71717a;--accent:#b85a3a;--accent-hover:#a04d31;--accent-dim:rgba(184,90,58,0.08);--on-accent:#ffffff;--success:#15803d;--danger:#dc2626;--warning:#b45309;--info:#2563eb}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg)}
html,body{font-family:var(--font-sans);background:var(--bg);color:var(--text);height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent}
/* The shell (static/codec-shell.js) sizes this column: it is the page's .cs-main. */
.app{display:flex;flex-direction:column;position:relative;overflow:hidden}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ico-sm{width:16px;height:16px}

/* ── Messages ── */
/* Reading column: 760px, centred. The side padding (16px on the phone) keeps the scrollbar at the window edge. */
.messages{flex:1;min-height:0;overflow-y:auto;padding:14px max(16px,calc((100% - 760px) / 2));-webkit-overflow-scrolling:touch}
.msg{margin-bottom:14px;max-width:85%;animation:fadeIn .2s ease;position:relative}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* The user's text is a soft right-aligned bubble. An assistant reply (.md, rendered Markdown) has no
   bubble and fills the column; cards (plans, questions, status, images) keep theirs. */
.msg.user{max-width:none;display:flex;flex-direction:column;align-items:flex-end}
.msg.assistant{margin-right:auto;max-width:100%}
.msg-bubble{padding:10px 14px;border-radius:14px;line-height:var(--lh-16);font-size:var(--fs-16);word-wrap:break-word;white-space:pre-wrap}
.msg-bubble.md{white-space:normal}
.msg.user .msg-bubble{max-width:80%;padding:10px 16px;border-radius:var(--radius-20);background:var(--surface-2);color:var(--text)}
.msg.assistant .msg-bubble{background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.assistant .msg-bubble.md{background:transparent;border:0;border-radius:0;padding:0}
.msg-bubble.md>.thinking-indicator{padding:4px 0}
.gen-img{display:block;max-width:100%;height:auto;border-radius:10px;margin-top:8px;border:1px solid var(--border)}
.gen-dl{display:inline-block;margin-top:6px;font-size:calc(12px * var(--fs-scale));color:var(--accent);text-decoration:none}
.img-status{font-size:calc(13px * var(--fs-scale));color:var(--text-muted);white-space:normal}
.img-cancel{margin-top:6px;padding:3px 10px;font-size:calc(12px * var(--fs-scale));border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text-dim);cursor:pointer}
#imageOpts{display:none;align-items:center;gap:6px}
#imageOpts select{background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);font-family:var(--font-mono);font-size:calc(12px * var(--fs-scale));border-radius:var(--radius-sm);padding:5px 9px;outline:none}
#imageOpts label{display:flex;align-items:center;gap:4px;font-size:calc(12px * var(--fs-scale));color:var(--text-dim);cursor:pointer}
.msg-stats{font-size:var(--fs-12);color:var(--text-dim);letter-spacing:.3px;margin-left:8px;cursor:default}
.msg-time{font-family:var(--font-mono);font-size:var(--fs-12);color:var(--text-dim);margin-top:3px;padding:0 4px}
.msg.user .msg-time{text-align:right}

/* ── Message action row: timestamp + regenerate / edit / copy / speak ──
   One inline row beneath each bubble (replaces the old corner-floating
   absolute buttons that clipped off-screen and left .msg-speak unstyled). */
.msg-meta{display:flex;align-items:center;gap:1px;margin-top:4px;
  opacity:.5;transition:opacity .15s}
.msg:hover .msg-meta{opacity:1}
.msg.user .msg-meta{justify-content:flex-end}
.msg-meta .msg-time{margin-top:0}
.msg-act{
  background:none;border:none;color:var(--text-dim);cursor:pointer;
  width:32px;height:32px;border-radius:8px;padding:0;
  display:inline-flex;align-items:center;justify-content:center;
  transition:color .12s,background .12s;
}
.msg-act .ico{width:18px;height:18px;stroke-width:1.75}
.msg-act:hover{color:var(--text);background:var(--surface-2)}
.msg-act:active{transform:scale(.9)}
.msg-act.copied{color:var(--success)}
.msg-act.speaking{color:var(--accent)}

.typing{color:var(--accent);font-size:calc(13px * var(--fs-scale));padding:8px 16px}
.typing span{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:currentColor;vertical-align:middle;animation:blink 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
.thinking-indicator{display:flex;align-items:center;gap:8px;padding:12px 16px;color:var(--text-muted);font-size:calc(13px * var(--fs-scale));font-style:italic}
.thinking-indicator .thinking-dots{display:inline-flex;gap:3px}
.thinking-indicator .thinking-dots span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:thinkPulse 1.4s ease-in-out infinite}
.thinking-indicator .thinking-dots span:nth-child(2){animation-delay:.2s}
.thinking-indicator .thinking-dots span:nth-child(3){animation-delay:.4s}
@keyframes thinkPulse{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}

/* ── Composer card (UI phase 1 PR-D) ──
   One card in the reading column: queued messages, attachments and the working
   folder above the textarea, then a toolbar row: + menu, mode pill and chips on
   the left; model pill, mic and send (stop while a reply streams) on the right. */
.input-area{position:relative;flex-shrink:0;padding:8px max(12px,calc((100% - 760px) / 2)) calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.composer{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-24);box-shadow:var(--shadow-composer);padding:12px 12px 8px 16px;transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:var(--border-strong)}
.composer:has(.chat-input:focus-visible){box-shadow:var(--shadow-composer),var(--focus-ring)}
.chat-input{display:block;width:100%;background:transparent;border:0;color:var(--text);padding:4px 0;font-size:max(16px,var(--fs-16));font-family:var(--font-sans);line-height:1.5;outline:none;resize:none;min-height:32px;max-height:40vh;overflow-y:auto}
.chat-input:focus-visible{outline:none}
.chat-input::placeholder{color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ibtn{background:none;border:0;border-radius:50%;color:var(--text-dim);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.ibtn:hover{color:var(--text)}
.file-chips:empty{display:none}
.file-chip{display:flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:4px 8px;font-size:var(--fs-13);font-family:var(--font-mono);color:var(--text-muted);max-width:200px}
.file-chip .fc-icon{font-size:calc(14px * var(--fs-scale));flex-shrink:0}
.file-chip .fc-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-chip .fc-close{cursor:pointer;color:var(--text-dim);font-size:calc(12px * var(--fs-scale));margin-left:2px;flex-shrink:0}
.file-chip .fc-close:hover{color:var(--danger)}
.file-chip.loading{opacity:.6}
.file-chip.loading .fc-icon{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.dragover .messages{border:2px dashed var(--accent)!important}
#dropOverlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(217,119,87,0.10);backdrop-filter:blur(2px)}
#dropOverlay.show{display:flex}
#dropOverlay .drop-inner{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--accent);font-size:calc(16px * var(--fs-scale));font-weight:600;padding:40px 60px;border:2px dashed var(--accent);border-radius:18px;background:var(--surface);box-shadow:0 10px 40px rgba(0,0,0,.25);pointer-events:none}
.composer-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;margin-top:4px}
.cb-left,.cb-right{display:flex;align-items:center;gap:6px;min-width:0}
.cb-left{flex:1;flex-wrap:wrap}
.cb-right{flex-shrink:0}
.cb-btn,.cb-send{width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
.cb-btn{background:transparent;color:var(--text-muted)}
.cb-btn:hover,.cb-btn[aria-expanded="true"]{background:var(--surface-2);color:var(--text)}
.cb-btn .ico{width:20px;height:20px;stroke-width:1.75}
.cb-btn.recording{background:var(--danger);color:#fff;animation:pulse 1s infinite}
.cb-send{background:var(--accent);color:var(--on-accent)}
.cb-send:hover{background:var(--accent-hover)}
.cb-send.empty{background:var(--surface-3);color:var(--text-dim)}
.cb-send .ico{width:18px;height:18px}
.cb-send.stop{display:none;background:var(--text);color:var(--bg)}
.cb-btn:active,.cb-send:active{transform:scale(.94)}
.mode-pill,.cb-chip{height:32px;display:inline-flex;align-items:center;gap:6px;border-radius:var(--radius-pill);font-family:var(--font-sans);font-weight:500;white-space:nowrap;cursor:pointer;max-width:100%}
.mode-pill{padding:0 10px 0 9px;border:0;background:var(--surface-2);color:var(--text);font-size:var(--fs-14)}
.mode-pill:hover,.mode-pill[aria-expanded="true"]{background:var(--surface-3)}
.mode-pill .mp-ico{display:inline-flex}
.mode-pill .ico{width:16px;height:16px;stroke-width:1.75}
.mode-pill .chev{width:14px;height:14px;color:var(--text-dim)}
.cb-chip{padding:0 10px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:var(--fs-13)}
.cb-chip:hover{border-color:var(--border-strong);color:var(--text)}
.cb-chip .ico{width:14px;height:14px;stroke-width:1.75}
.cb-chip .cc-label{overflow:hidden;text-overflow:ellipsis}
.cb-chip.static{padding-right:4px;cursor:default}
.cb-chip .x{width:24px;height:24px;border-radius:50%;border:0;background:none;color:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.cb-chip .x:hover{background:var(--surface-2);color:var(--text)}
/* Model pill: sans, never mono (design brief). Accent while a non-everyday model is active. */
#modelSelect{height:32px;background:var(--surface-2);border:0;color:var(--text-muted);font-family:var(--font-sans);font-size:var(--fs-13);font-weight:500;border-radius:var(--radius-pill);padding:0 12px;outline:none;cursor:pointer;max-width:200px;transition:color .15s,box-shadow .15s}
#modelSelect:hover{color:var(--text)}
#modelSelect.alt{color:var(--accent);box-shadow:inset 0 0 0 1px rgba(217,119,87,.45)}
#modelSelect:disabled{opacity:.5;cursor:progress}
/* Menus: one popover component, above the composer. */
.pop-menu{position:absolute;bottom:calc(100% + 8px);left:8px;z-index:60;min-width:240px;max-width:min(340px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-12);box-shadow:var(--shadow-popover);padding:6px;display:none}
.pop-menu.open{display:block}
.pop-item{width:100%;display:flex;align-items:center;gap:10px;min-height:36px;padding:6px 10px;border:0;border-radius:var(--radius-8);background:none;color:var(--text);font-family:var(--font-sans);font-size:var(--fs-14);line-height:1.3;text-align:left;cursor:pointer}
.pop-item:hover,.pop-item:focus-visible{background:var(--surface-2)}
.pop-item .ico{width:18px;height:18px;stroke-width:1.75;color:var(--text-muted)}
.pop-item .pi-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pop-item .pi-desc{font-size:var(--fs-12);color:var(--text-muted)}
.pop-item .pi-tag{font-size:var(--fs-12);color:var(--text-dim)}
.pop-item .pi-check{width:16px;height:16px;color:var(--accent);visibility:hidden}
.pop-item[aria-checked="true"] .pi-check{visibility:visible}
.pop-sep{height:1px;background:var(--border);margin:4px 6px}
.touch-only{display:none}
@media (hover:none) and (pointer:coarse){.touch-only{display:flex}}
/* Messages sent while a reply streams wait here and send when it ends. */
.queue-chips{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.queue-chips:empty{display:none}
.queue-chip{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 12px;border-radius:var(--radius-12);background:var(--surface-2);font-size:var(--fs-14);color:var(--text)}
.queue-chip .qc-label{flex-shrink:0;font-size:var(--fs-12);font-weight:600;color:var(--text-muted)}
.queue-chip .qc-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue-chip button{width:28px;height:28px;flex-shrink:0;border-radius:var(--radius-8);border:0;background:none;color:var(--text-muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.queue-chip button:hover{background:var(--surface-3);color:var(--text)}
.queue-chip .ico{width:16px;height:16px;stroke-width:1.75}
.jump-latest{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);z-index:50;display:none;align-items:center;gap:6px;height:32px;padding:0 14px 0 10px;border-radius:var(--radius-pill);border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--font-sans);font-size:var(--fs-13);font-weight:500;box-shadow:var(--shadow-popover);cursor:pointer;white-space:nowrap}
.jump-latest.show{display:inline-flex}
.jump-latest .ico{width:16px;height:16px;stroke-width:1.75}
/* Agents sheet: centred card on desktop, bottom sheet on the phone. */
.sheet-overlay{position:fixed;inset:0;z-index:10005;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5)}
.sheet-overlay.open{display:flex}
.sheet{width:min(600px,100%);max-height:min(84vh,760px);overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-20);box-shadow:var(--shadow-popover);padding:16px 18px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-head h2{font-family:var(--font-sans);font-size:var(--fs-16);font-weight:600;color:var(--text)}
.sheet-x{width:32px;height:32px;border-radius:50%;border:0;background:none;color:var(--text-muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.sheet-x:hover{background:var(--surface-2);color:var(--text)}
.sheet-x .ico{width:18px;height:18px;stroke-width:1.75}
.sheet-sub{margin:4px 0 12px;font-size:var(--fs-13);color:var(--text-muted)}
.crew-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.crew-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-12);background:transparent;color:var(--text);font-family:var(--font-sans);text-align:left;cursor:pointer;min-width:0}
.crew-item:hover{border-color:var(--border-strong);background:var(--surface-2)}
.crew-item.active{border-color:var(--accent);background:var(--accent-dim)}
.crew-item .ci-title{font-size:var(--fs-14);font-weight:500}
.crew-item .ci-desc{font-size:var(--fs-12);color:var(--text-muted)}
.crew-item .ci-desc:empty{display:none}
.sheet-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.sheet-label{font-size:var(--fs-13);color:var(--text-muted)}
#researchModelSelect{height:32px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-family:var(--font-sans);font-size:var(--fs-13);border-radius:var(--radius-8);padding:0 10px;cursor:pointer}
.sheet-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.sheet-btn{height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 16px;border-radius:var(--radius-pill);border:1px solid var(--border);background:transparent;color:var(--text);font-family:var(--font-sans);font-size:var(--fs-14);font-weight:500;cursor:pointer}
.sheet-btn:hover{background:var(--surface-2)}
.sheet-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sheet-btn.primary:hover{background:var(--accent-hover)}
.sheet-btn .ico{width:16px;height:16px;stroke-width:1.75}
/* New chat: greeting, starter cards, recent chats. On desktop the composer sits
   under them, centred in the window, and docks at the bottom after the first message. */
.empty-state{padding:32px 0 16px}
.greet-title{font-family:var(--font-sans);font-size:var(--fs-30);line-height:var(--lh-30);font-weight:400;color:var(--text)}
.greet-sub{margin-top:6px;font-size:var(--fs-16);line-height:var(--lh-16);color:var(--text-muted)}
.starters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:24px}
.starter{display:flex;align-items:flex-start;gap:10px;min-width:0;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-12);background:var(--surface);color:var(--text);font-family:var(--font-sans);text-align:left;cursor:pointer;transition:border-color .12s,background .12s}
.starter:hover{border-color:var(--border-strong);background:var(--surface-2)}
.starter .ico{width:18px;height:18px;stroke-width:1.75;color:var(--accent);margin-top:1px}
.starter .st-text{min-width:0;display:flex;flex-direction:column;gap:2px}
.starter .st-title{font-size:var(--fs-14);font-weight:500;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.starter .st-desc{font-size:var(--fs-12);color:var(--text-muted)}
.recent{margin-top:20px}
.recent-h{margin:0 0 4px 10px;font-size:var(--fs-12);font-weight:600;color:var(--text-dim)}
.recent-item{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;padding:8px 10px;border:0;border-radius:var(--radius-8);background:none;color:var(--text-muted);font-family:var(--font-sans);font-size:var(--fs-14);text-align:left;cursor:pointer}
.recent-item:hover{background:var(--surface-2);color:var(--text)}
.recent-item .ri-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent-item .ri-time{flex-shrink:0;font-size:var(--fs-12);color:var(--text-dim)}
.app.is-empty .messages{flex:0 1 auto;margin-top:auto}
.app.is-empty .input-area{margin-bottom:auto}
pre{background:var(--surface-3);padding:10px;border-radius:8px;overflow-x:auto;font-family:var(--font-mono);font-size:var(--fs-code);margin:8px 0}
pre code{font-size:1em}
code{font-family:var(--font-mono);font-size:var(--fs-code-inline);background:var(--surface-3);padding:2px 6px;border-radius:4px}
input[type=file]{display:none}

.discuss-report-btn{margin-top:2px;padding:9px 16px;border:1px solid var(--accent);border-radius:8px;cursor:pointer;font-size:calc(13px * var(--fs-scale));font-family:var(--font-sans);font-weight:600;background:var(--accent);color:var(--on-accent);transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.discuss-report-btn:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
.discuss-report-btn:disabled{cursor:default;opacity:.7;background:transparent;color:var(--accent)}
/* Train-of-thought panel — reveals reasoning (chat) / agent steps, collapsed by default */
/* Train-of-thought: a reveal control + a fixed-size continuously-scrolling window (like public LLM "thinking") */
.tot{margin:2px 0 6px}
.tot-toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--text-dim);font-size:calc(12px * var(--fs-scale));user-select:none;padding:2px 0}
.tot-toggle:hover{color:var(--text-muted)}
.tot-toggle .chev{font-size:calc(12px * var(--fs-scale));transition:transform .15s;color:var(--accent)}
.tot.open .tot-toggle .chev{transform:rotate(90deg)}
.tot-window{display:none;margin-top:6px;height:150px;overflow-y:auto;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:calc(12px * var(--fs-scale));line-height:1.6;color:var(--text-dim);word-break:break-word;font-family:var(--font-sans)}
.tot-window.md h1,.tot-window.md h2,.tot-window.md h3{font-size:1em}
.tot.open .tot-window{display:block}
.tot-live .tot-toggle .chev{animation:totPulse 1.2s ease-in-out infinite}
@keyframes totPulse{0%,100%{opacity:.4}50%{opacity:1}}
/* small inline stop button under the agent status message */
.status-stop{margin-top:8px;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--border);border-radius:14px;background:transparent;color:var(--text-muted);font-size:calc(12px * var(--fs-scale));font-family:var(--font-sans);cursor:pointer;transition:all .15s}
.status-stop:hover{border-color:#e55;color:#e55}

/* ── Agent Builder ── */
#agentBuilder{display:none;margin-top:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-12);padding:12px 14px;gap:10px;flex-direction:column}
#agentBuilder.show{display:flex}
.ab-row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.ab-field{display:flex;flex-direction:column;gap:3px;flex:1;min-width:140px}
.ab-label{font-size:var(--fs-13);font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em}
.ab-input{background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:7px 10px;color:var(--text);font-size:calc(12px * var(--fs-scale));font-family:var(--font-sans);outline:none;width:100%}
.ab-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
.ab-ta{height:56px;resize:vertical}
.ab-tools{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:3px;max-height:100px;overflow-y:auto}
.ab-tool{display:flex;align-items:center;gap:5px;padding:2px 3px;border-radius:3px;cursor:pointer;font-size:var(--fs-14);color:var(--text-muted)}
.ab-tool:hover{background:var(--surface-3);color:var(--text)}
.ab-tool input{accent-color:var(--accent);cursor:pointer}
.ab-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ab-btn{padding:6px 12px;border-radius:5px;border:none;font-size:var(--fs-14);font-weight:600;cursor:pointer;transition:opacity .2s;font-family:var(--font-sans)}
.ab-save{background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border)}
.ab-save:hover{color:var(--text)}
.ab-load-wrap{display:flex;align-items:center;gap:6px}
.ab-select{background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:4px 8px;color:var(--text-muted);font-size:var(--fs-14);font-family:var(--font-sans);cursor:pointer}

/* ── Crew Select ── */
#crewSelect{display:none}

/* ── Toast ── */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:7px 14px;font-size:var(--fs-14);color:var(--text);opacity:0;transition:all .2s;z-index:200;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Scrollbar ── */
*{scrollbar-width:thin;scrollbar-color:var(--border) transparent}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}

/* ── Mobile Responsive ── */
@media (max-width: 768px), (max-height: 600px) and (pointer: coarse){
  .msg{max-width:90%}
  
  #agentBuilder .ab-row{flex-direction:column}
  #agentBuilder .ab-field{min-width:100%;max-width:100%!important}
  .msg-meta{opacity:.7}
}
@media (max-width:480px){
  .messages{padding:10px 16px}
}
.webcam-pip{position:fixed;bottom:80px;right:20px;width:240px;border-radius:14px;overflow:hidden;border:2px solid var(--accent);box-shadow:0 4px 24px rgba(0,0,0,.5);z-index:9999;display:none;background:#000;transition:width .3s,height .3s,border-radius .3s}
.webcam-pip img,.webcam-pip video{width:100%;display:block}
.webcam-pip.expanded{width:640px;max-width:90vw;border-radius:10px}
.pip-bar{display:flex;justify-content:center;gap:10px;padding:6px;background:rgba(0,0,0,.6)}
.pip-btn{background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.pip-btn:hover{background:var(--accent)}
.pip-btn.snap-btn{background:rgba(255,80,80,.7)}
.pip-btn.snap-btn:hover{background:#e33}
/* ── Screenshot/Photo Modal ── */
.modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); z-index:100; justify-content:center; align-items:center; padding:20px; }
.modal-overlay.show { display:flex; }
.modal-overlay img { max-width:100%; max-height:90vh; border-radius:var(--radius); border:1px solid var(--border); }
.modal-close { position:fixed; top:16px; right:16px; background:rgba(30,30,30,0.9); color:#fff; border:2px solid rgba(255,255,255,0.3); width:44px; height:44px; border-radius:50%; font-size:calc(26px * var(--fs-scale)); cursor:pointer; z-index:101; display:flex; align-items:center; justify-content:center; transition:background 0.2s, transform 0.2s; }
.modal-close:hover { background:rgba(220,50,50,0.9); transform:scale(1.1); }
@media(max-width:600px){ .modal-close { width:52px; height:52px; font-size:calc(30px * var(--fs-scale)); top:10px; right:10px; } }

@media (max-width: 768px), (max-height: 600px) and (pointer: coarse){
  /* Phone (P2.1): the composer sits in the flow above the shell's tab bar, full
     width minus 12px gutters (no position:fixed, no measured padding). The model
     pill lives in the top bar; the Agents sheet is a bottom sheet; toasts show
     under the top bar, clear of the composer. */
  .modal-overlay{z-index:10002}
  .modal-close{z-index:10003}
  .toast{z-index:10004;bottom:auto;top:calc(60px + env(safe-area-inset-top,0px))}
  .input-area{padding:6px 12px 8px;background:var(--bg)}
  .app.is-empty .messages{flex:1;margin-top:0}
  .app.is-empty .input-area{margin-bottom:0}
  #hdrModelSlot #modelSelect{max-width:136px;height:30px;padding:0 10px}
  .starters{grid-template-columns:1fr}
  .empty-state{padding-top:16px}
  .greet-title{font-size:var(--fs-24);line-height:var(--lh-24)}
  .sheet-overlay{align-items:flex-end;padding:0}
  .sheet{width:100%;max-height:88vh;border-radius:var(--radius-20) var(--radius-20) 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>
<script src="/static/codec-shell.js?v=d03f5d95" data-page="chat" data-title="Chat" data-status data-model-slot></script>
<div class="app cs-main" id="appContainer">
<div class="messages" id="messages"></div>

<div class="input-area">
<button type="button" class="jump-latest" id="jumpLatest" onclick="jumpToLatest()"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>Jump to latest</button>
<div class="composer" id="composer">
<div class="pop-menu" id="plusMenu" role="menu" aria-label="Add to your message">
  <button type="button" class="pop-item" role="menuitem" onclick="closeMenus();document.getElementById('fileUp').click()"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg><span class="pi-text">Attach files</span></button>
  <button type="button" class="pop-item touch-only" role="menuitem" onclick="closeMenus();document.getElementById('photoUp').click()"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span class="pi-text">Photo or camera</span></button>
  <button type="button" class="pop-item" role="menuitem" onclick="closeMenus();takeScreenshot()"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><span class="pi-text">Screenshot of Mac</span></button>
  <button type="button" class="pop-item" role="menuitem" onclick="closeMenus();takeServerPhoto()"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg><span class="pi-text">Webcam snapshot</span></button>
  <button type="button" class="pop-item" id="folderBtn" role="menuitem" onclick="closeMenus();pickWorkingFolder()" title="Give this chat a working folder on the Mac"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg><span class="pi-text">Working folder</span><span class="pi-tag">on Mac</span></button>
  <div class="pop-sep" role="separator"></div>
  <button type="button" class="pop-item" id="webSearchItem" role="menuitemcheckbox" aria-checked="false" onclick="toggleWebSearch()"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg><span class="pi-text">Search the web</span><svg class="ico pi-check" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></button>
</div>
<div class="pop-menu" id="modeMenu" role="menu" aria-label="Mode">
  <button type="button" class="pop-item" role="menuitemradio" aria-checked="false" data-mode="chat" id="modeChatBtn" onclick="chooseMode('chat')"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><span class="pi-text">Chat<span class="pi-desc">Fast answers</span></span><svg class="ico pi-check" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></button>
  <button type="button" class="pop-item" role="menuitemradio" aria-checked="false" data-mode="think" id="modeThinkBtn" onclick="chooseMode('think')"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg><span class="pi-text">Think<span class="pi-desc">Reasons first: better answers, slower</span></span><svg class="ico pi-check" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></button>
  <button type="button" class="pop-item" role="menuitemradio" aria-checked="false" data-mode="research" id="modeResearchBtn" onclick="chooseMode('research')"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="10" r="1.5" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="1.5" fill="currentColor" stroke="none"/><path d="M9 15h6"/></svg><span class="pi-text">Agents<span class="pi-desc">Run a crew: research, briefing, trips and more</span></span><svg class="ico pi-check" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></button>
  <button type="button" class="pop-item" role="menuitemradio" aria-checked="false" data-mode="project" id="modeProjectBtn" onclick="chooseMode('project')"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5"/><line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg><span class="pi-text">Project<span class="pi-desc">Plan and build a bigger job in the background</span></span><svg class="ico pi-check" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></button>
  <button type="button" class="pop-item" role="menuitemradio" aria-checked="false" data-mode="image" id="modeImageBtn" onclick="chooseMode('image')" style="display:none"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span class="pi-text">Image<span class="pi-desc">Create an image on this Mac</span></span><svg class="ico pi-check" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></button>
</div>
<div class="queue-chips" id="queueChips"></div>
<div class="file-chips" id="fileChips"></div>
<div id="workdirChip" style="display:none;align-items:center;gap:6px;margin:0 0 6px 2px;font-size:calc(12px * var(--fs-scale));color:var(--text-dim)">
  <svg class="ico" viewBox="0 0 24 24" style="width:13px;height:13px"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
  <span id="workdirPath" style="max-width:60ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
  <button class="ibtn" onclick="clearWorkingFolder()" title="Remove working folder" style="width:16px;height:16px;padding:0">
    <svg class="ico" viewBox="0 0 24 24" style="width:11px;height:11px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
</div>
<textarea class="chat-input" id="chatInput" placeholder="Message CODEC" rows="1" aria-label="Message CODEC" onkeydown="handleKey(event)"></textarea>
<div class="composer-bar">
<div class="cb-left">
<button type="button" class="cb-btn" id="plusBtn" onclick="toggleMenu('plusMenu',this)" title="Add files and more" aria-label="Add files and more" aria-haspopup="menu" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
<button type="button" class="mode-pill" id="modePill" onclick="toggleMenu('modeMenu',this)" title="Mode" aria-haspopup="menu" aria-expanded="false"><span class="mp-ico"></span><span class="mp-label">Think</span><svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg></button>
<button type="button" class="cb-chip" id="crewChip" onclick="openAgentSheet()" title="Choose the crew" style="display:none"><span class="cc-label">Deep Research</span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg></button>
<span class="cb-chip static" id="webChip" style="display:none"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>Web search<button type="button" class="x" onclick="toggleWebSearch()" title="Turn off web search" aria-label="Turn off web search"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span>
<span id="imageOpts"><select id="imageSize" title="Image size — the first image takes about 2 min at 512 px"><option value="512">512 px (~2 min)</option><option value="768">768 px</option><option value="1024">1024 px</option></select><label title="Transparent background"><input type="checkbox" id="imageTransparent">Transparent</label></span>
</div>
<div class="cb-right">
<span id="cbModelSlot"><select id="modelSelect" onchange="switchModel()" title="Local model — switching unloads the current one and loads the new one" style="display:inline-block">
<option value="">model…</option>
</select></span>
<button type="button" class="cb-btn" id="micBtn" onclick="toggleMic()" title="Voice input" aria-label="Voice input"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
<button type="button" class="cb-send empty" id="sendBtn" onclick="sendMessage()" title="Send" aria-label="Send"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
<button type="button" class="cb-send stop" id="stopBtn" onclick="stopGeneration()" title="Stop generating" aria-label="Stop generating"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg></button>
</div>
</div>
</div>
<input type="file" id="fileUp" accept="*/*" multiple onchange="handleUpload(event)">
<input type="file" id="photoUp" accept="image/*" capture="environment" onchange="handleUpload(event)">
</div>

<!-- Agents: the crew picker and the custom-agent builder open in a sheet from the mode pill -->
<div class="sheet-overlay" id="agentSheet" onclick="if(event.target===this)closeAgentSheet()">
<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="agentSheetTitle">
<div class="sheet-head"><h2 id="agentSheetTitle">Agents</h2><button type="button" class="sheet-x" onclick="closeAgentSheet()" aria-label="Close"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
<p class="sheet-sub">Pick a crew, then type its task in the message box and press Send.</p>
<div class="crew-list" id="crewList"></div>
<select id="crewSelect" hidden>
<option value="deep_research">Deep Research</option>
<option value="daily_briefing">Daily Briefing</option>
<option value="trip_planner">Trip Planner</option>
<option value="competitor_analysis">Competitor Analysis</option>
<option value="email_handler">Email Handler</option>
<option value="social_media">Social Media</option>
<option value="code_review">Code Review</option>
<option value="data_analysis">Data Analysis</option>
<option value="content_writer">Content Writer</option>
<option value="meeting_summarizer">Meeting Summarizer</option>
<option value="invoice_generator">Invoice Generator</option>
<option value="project_manager">Project Manager</option>
<option value="custom">Custom Agent</option>
</select>
<div class="sheet-row" id="researchModelRow" style="display:none"><span class="sheet-label">Research model</span><select id="researchModelSelect" title="Deep Research model — 35B (default) or 27B. Other models are not used for research.">
<option value="mlx-community/Qwen3.6-35B-A3B-4bit" selected>35B (default)</option>
<option value="mlx-community/Qwen3.8-27B-4bit">27B</option>
</select></div>
<!-- Custom Agent Builder -->
<div id="agentBuilder">
  <div class="ab-row">
    <div class="ab-field" style="max-width:160px">
      <span class="ab-label">Agent Name</span>
      <input class="ab-input" id="agentName" placeholder="My Research Agent" value="Custom Agent">
    </div>
    <div class="ab-field" style="flex:2">
      <span class="ab-label">Role / System Prompt</span>
      <textarea class="ab-input ab-ta" id="agentRole" placeholder="You are an expert researcher..."></textarea>
    </div>
    <div class="ab-field" style="max-width:70px">
      <span class="ab-label">Max Steps</span>
      <input class="ab-input" id="agentMaxIter" type="number" value="8" min="1" max="20">
    </div>
  </div>
  <div class="ab-field">
    <span class="ab-label">Tools <span id="abToolCount" style="color:var(--accent)"></span></span>
    <div class="ab-tools" id="abToolGrid">
      <span style="font-size:calc(12px * var(--fs-scale));color:var(--text-dim);padding:4px">Loading tools...</span>
    </div>
  </div>
  <div class="ab-actions">
    <button class="ab-btn ab-save" onclick="saveCustomAgent()">Save Agent</button>
    <div class="ab-load-wrap">
      <select class="ab-select" id="savedAgentSelect" onchange="loadSavedAgent(this.value)">
        <option value="">Load saved...</option>
      </select>
      <button class="ab-btn" onclick="deleteSelectedAgent()" title="Delete selected agent" style="background:var(--danger);padding:4px 8px;font-size:calc(12px * var(--fs-scale))">Delete</button>
    </div>
    <span style="font-size:calc(12px * var(--fs-scale));color:var(--text-dim)">Type your task below and press Send</span>
  </div>

function setMode(mode){
  var changed=chatMode!==mode;
  chatMode=mode;
  document.getElementById('modeChatBtn').classList.toggle('active',mode==='chat');
  document.getElementById('modeResearchBtn').classList.toggle('active',mode==='research');
  var pBtn=document.getElementById('modeProjectBtn');
  if(pBtn)pBtn.classList.toggle('active',mode==='project');
  var iBtn=document.getElementById('modeImageBtn');
  if(iBtn)iBtn.classList.toggle('active',mode==='image');
  var iOpts=document.getElementById('imageOpts');
  if(iOpts)iOpts.style.display=mode==='image'?'flex':'none';
  // Reference images belong to Image mode only; drop them when leaving it.
  if(mode!=='image')pendingFiles.filter(function(f){return f.type==='imgref'}).forEach(function(f){removeChip(f.id)});
  var cs=document.getElementById('crewSelect');
  var crew=mode==='research'?cs.value:'deep_research';
  // Deep Research restricts the model to 35B/27B: show the research picker and
  // hide the normal chat model picker so no other (voice/4B) model is selectable.
  var _rms=document.getElementById('researchModelSelect');
  var _showRms=(mode==='research'&&crew==='deep_research');
  var _rmr=document.getElementById('researchModelRow');
  if(_rmr)_rmr.style.display=_showRms?'flex':'none';
  var _msel=document.getElementById('modelSelect');
  if(_msel)_msel.style.display=(_showRms||mode==='image')?'none':'inline-block';
  var hints={'deep_research':'Research topic... (3-6 min)','daily_briefing':'Press send for daily briefing','trip_planner':'Destination + dates...','competitor_analysis':'Market or product to analyze...','email_handler':'Press send to handle inbox','custom':'Describe your task for the custom agent...'};
  // If the user toggles to chat mode AFTER an agent already produced a
  // report, the report sits in chatHist as the last assistant message —
  // any follow-up chat call carries it forward via the messages[] array
  // sent to /api/chat, so the LLM has the full report as context. Hint
  // that explicitly in the placeholder so the user knows they can ask
  // follow-up questions.
  var hasAgentReport=mode==='chat'&&chatHist.some(function(m){return m.role==='assistant'&&typeof m.content==='string'&&m.content.indexOf('Complete!')!==-1});
  var ph;
  if(mode==='research')ph=hints[crew]||'Enter crew task...';
  else if(mode==='project')ph='Drop your project here — describe what you want CODEC to build...';
  else if(mode==='image')ph='Describe the image to create (attach up to '+_imgMaxRefs+' reference images)...';
  else ph=hasAgentReport?'Ask a follow-up about the report':'Message CODEC';
  document.getElementById('chatInput').placeholder=ph;
  document.getElementById('scheduleBtn').style.display=mode==='research'?'':'none';
  var builder=document.getElementById('agentBuilder');
  if(mode==='research'&&crew==='custom'){builder.classList.add('show');if(!_toolsLoaded)loadAgentTools();loadSavedAgentList()}else{builder.classList.remove('show')}
  // Phase 3.5 Step 11: Project-mode on-screen instructions panel
  var pPanel=document.getElementById('projectModePanel');
  if(mode==='project'){
    if(!pPanel){
      pPanel=document.createElement('div');
      pPanel.id='projectModePanel';
      pPanel.style.cssText='margin:12px 16px 8px;padding:14px 16px;background:var(--accent-dim);border:1px solid var(--accent);border-radius:10px;font-size:calc(13px * var(--fs-scale));line-height:1.5';
      pPanel.innerHTML=
        '<div style="font-weight:600;color:var(--accent);margin-bottom:6px">Project mode — autonomous plan-and-build</div>'+
        '<div style="color:var(--text-dim);margin-bottom:6px">Tell me what you want built or handled. I\'ll ask if anything\'s unclear, then show you the plan — one approval and I take it from there, updates posted right here.</div>'+
        '<a href="https://github.com/AVADSA25/codec#readme" target="_blank" rel="noopener" style="color:var(--accent);font-size:calc(12px * var(--fs-scale));text-decoration:none">Learn more &rarr;</a>';
    }
    var msgsEl=document.getElementById('messages');
    if(msgsEl&&!document.getElementById('projectModePanel')){
      msgsEl.parentNode.insertBefore(pPanel,msgsEl);
    }
  }else if(pPanel){
    pPanel.remove();
  }
  // Live-switch behaviour: only wipe the session when the chat is EMPTY.
  // If there's already a conversation (e.g. an agent just returned a deep-
  // research report), keep chatHist intact so the user can flip into chat
  // mode and continue asking follow-up questions about the report. The
  // explicit "+" / new-chat button remains the way to start fresh.
  if(changed&&!isProcessing&&chatHist.length===0)startNewSession();
  // One-shot toast on first toggle to chat mode after a report — helps
  // the user discover that context is preserved.
  if(changed&&mode==='chat'&&hasAgentReport){
    try{showToast('Context preserved — ask follow-up questions about the report')}catch(e){}
  }
  _syncModeUi();
}

function regenerateResponse(btn){
  if(isProcessing)return;
  // Remove last assistant message from history and UI
  var msgDiv=btn.closest('.msg');
  if(msgDiv)msgDiv.remove();
  // Pop last assistant from chatHist
  while(chatHist.length&&chatHist[chatHist.length-1].role==='assistant')chatHist.pop();
  if(!chatHist.length)return;
  // Find last user message to re-send
  var lastUser='';
  for(var i=chatHist.length-1;i>=0;i--){if(chatHist[i].role==='user'){lastUser=chatHist[i].content;break}}
  if(!lastUser)return;
  // Re-run the chat call
  isProcessing=true;document.getElementById('sendBtn').disabled=true;_showStop();showTyping();
  _currentAbort=new AbortController();
  var msgs=[{role:'system',content:buildSystem()}].concat(chatHist);
  var raw='',div=null; // outside the .then so the .catch can keep a partial answer
  fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,force_search:webSearchEnabled,thinking:false,show_thoughts:false,reason_scaffold:thinkingEnabled,stream:true,workdir:_workdir}),signal:_currentAbort.signal}).then(async function(r){
    if(r.status===401||r.status===403){hideTyping();addMessage('assistant','Session expired — redirecting to login...');setTimeout(function(){window.location.href='/auth'},1500);isProcessing=false;_showSend();document.getElementById('sendBtn').disabled=false;return}
    hideTyping();
    var reader=r.body.getReader();var decoder=new TextDecoder();raw='';var bubbleId='stream_'+genId();
    div=document.createElement('div');div.className='msg assistant';div.innerHTML='<div class="msg-bubble md" id="'+bubbleId+'"><div class="thinking-indicator"><div class="thinking-dots"><span></span><span></span><span></span></div>CODEC is thinking...</div></div>';document.getElementById('messages').appendChild(div);
    var bubble=document.getElementById(bubbleId);var buf='';var answerStream=null;
    while(true){
      var chunk=await reader.read();
      if(chunk.done)break;
      buf+=decoder.decode(chunk.value,{stream:true});
      var lines=buf.split('\n');buf=lines.pop();
      for(var li=0;li<lines.length;li++){
        var line=lines[li].trim();if(!line.startsWith('data: '))continue;var payload=line.substring(6);
        if(payload==='[DONE]')break;
        try{var j=JSON.parse(payload);if(j.stats){_lastStats=j.stats}if(j.skill){showToast('Skill: '+j.skill)}if(j.token){raw+=j.token;var ps=parseScaffold(raw);if(thinkingEnabled&&ps.think){var tp=makeToT(div,'Reveal train of thought',true);totSet(tp,ps.think)}if(ps.answer){(answerStream||(answerStream=mdStream(bubble,{onRender:scrollBottom}))).update(ps.answer)}scrollBottom()}if(j.error){raw+='\nError: '+j.error}}catch(pe){}
      }
    }
    var pf=parseScaffold(raw);
    // Fallback order: real FINAL ANSWER > text outside the thinking block
    // (also stripping an UNCLOSED <thinking> tail — a cut/degenerate stream
    // must never dump raw reasoning into the bubble) > honest glitch notice
    // with the reasoning kept in the reveal panel.
    var answer=(pf.answer&&pf.answer.trim())||raw.replace(/<thinking>[\s\S]*?<\/thinking>/i,'').replace(/<thinking>[\s\S]*$/i,'').replace(/###\s*FINAL ANSWER:?/i,'').replace(/<\/?final\s*answer>/gi,'').trim();
    if(!answer&&pf.think&&pf.think.trim()){answer='*My reasoning ran on without reaching a final answer — a local-model glitch, not a real reply. The train of thought is below; please ask again.*'}
    if(answer){
      div.remove();var md=addMessage('assistant',answer);
      if(thinkingEnabled&&pf.think&&pf.think.trim()&&md){var fp=makeToT(md,'Train of thought',false);totSet(fp,pf.think.trim())}
      if(md&&_lastStats)renderStats(md,_lastStats);_lastStats=null;
      chatHist.push({role:'assistant',content:answer});saveMessages([{role:'assistant',content:answer}])
    }else{if(answerStream)answerStream.cancel();bubble.innerHTML='<em style="color:var(--text-dim)">No response</em>'}
    _currentAbort=null;isProcessing=false;_showSend();document.getElementById('sendBtn').disabled=false
  }).catch(function(e){
    hideTyping();
    _keepPartial(raw,div);
    if(e.name!=='AbortError')addMessage('assistant','Error: '+e.message);
    _currentAbort=null;isProcessing=false;_showSend();document.getElementById('sendBtn').disabled=false
  })
}

// ── Send button state + queued messages ────────────────────────────────────
// Send is muted while the composer is empty. While a reply streams, Stop shows,
// and Send stays next to it whenever there is text, to queue that text.
var _streamingUi=false,_queue=[],_queuePaused=false;
function _syncSendState(){
  var ci=document.getElementById('chatInput'),send=document.getElementById('sendBtn'),stop=document.getElementById('stopBtn');
  if(!ci||!send||!stop)return;
  var hasText=!!ci.value.trim();
  stop.style.display=_streamingUi?'inline-flex':'none';
  send.style.display=(!_streamingUi||hasText)?'inline-flex':'none';
  send.classList.toggle('empty',!hasText&&!pendingFiles.length&&!(_queue.length&&!_streamingUi));
  send.title=_streamingUi?'Queue this message':'Send';send.setAttribute('aria-label',send.title);
  send.disabled=false;
}
function _renderQueue(){
  var el=document.getElementById('queueChips');if(!el)return;
  el.innerHTML='';
  _queue.forEach(function(t,i){
    var c=document.createElement('div');c.className='queue-chip';
    c.innerHTML='<span class="qc-label">'+(_queuePaused?'Kept':'Queued')+'</span><span class="qc-text"></span>'+
      '<button type="button" data-act="edit" title="Edit" aria-label="Edit queued message"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>'+
      '<button type="button" data-act="remove" title="Remove" aria-label="Remove queued message"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>';
    c.querySelector('.qc-text').textContent=t;
    c.querySelector('[data-act="edit"]').addEventListener('click',function(){_editQueued(i)});
    c.querySelector('[data-act="remove"]').addEventListener('click',function(){_queue.splice(i,1);_renderQueue()});
    el.appendChild(c);
  });
  _syncSendState();
}
function _editQueued(i){
  var t=_queue.splice(i,1)[0],ci=document.getElementById('chatInput');
  ci.value=ci.value.trim()?(t+'\n'+ci.value):t;_autosize(ci);ci.focus();_renderQueue();
}
// Runs after every reply ends (from _showSend). Stop pauses the queue: it waits
// until the owner presses Send.
function _drainQueue(){setTimeout(function(){if(isProcessing||_queuePaused||!_queue.length)return;var t=_queue.shift();_renderQueue();sendMessage(t)},0)}
function _clearQueue(){_queue=[];_queuePaused=false;_renderQueue()}
function _autosize(ta){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,Math.round(window.innerHeight*0.4))+'px'}
(function(){var ci=document.getElementById('chatInput');if(ci)ci.addEventListener('input',function(){_autosize(ci);_syncSendState()})})();

// ── Follow the stream only at the bottom (P1.8) ────────────────────────────
// A reader who scrolls up more than 80px stops the page following the reply;
// "Jump to latest" brings them back and following resumes.
var _follow=true,_userScrollAt=0;
function _nearBottom(m){return m.scrollHeight-m.scrollTop-m.clientHeight<80}
function _showJump(on){var j=document.getElementById('jumpLatest');if(j)j.classList.toggle('show',!!on)}
function jumpToLatest(){var m=document.getElementById('messages');if(!m)return;_follow=true;m.scrollTop=m.scrollHeight;_showJump(false)}
(function(){
  var m=document.getElementById('messages');if(!m)return;
  function mark(){_userScrollAt=Date.now()}
  ['wheel','touchmove','mousedown'].forEach(function(ev){m.addEventListener(ev,mark,{passive:true})});
  document.addEventListener('keydown',function(e){if(/^(PageUp|PageDown|Home|End|ArrowUp|ArrowDown| )$/.test(e.key)&&!/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||''))mark()});
  // Only a scroll the reader made changes following; the page's own scrolls do not.
  m.addEventListener('scroll',function(){
    if(!_follow||Date.now()-_userScrollAt<800){var near=_nearBottom(m);_follow=near;_showJump(!near)}
  },{passive:true});
})();

function _renderEmptyState(){

  m.innerHTML='<div class="empty-state" id="emptyState"><div class="greet-title"></div><div class="greet-sub">What should we work on?</div><div class="starters"></div><div class="recent" hidden><div class="recent-h">Recent</div></div></div>';

  STARTERS.forEach(function(s){grid.appendChild(_starterBtn(s.ico,s.title,s.desc,function(){sendStarter(s.send)}))});
  fetch('/api/qchat/sessions').then(function(r){return r.ok?r.json():[]}).then(function(data){

// ── Train of thought ───────────────────────────────────────────────────────
// A reveal control ("click to reveal train of thought") + a fixed-size window
// that streams the reasoning continuously (like public LLMs). Available in
// Think mode (chat reasoning) and Agent/Project mode (live crew steps). No
// top-bar toggle — it lives right under each message / status, collapsed until
// clicked.
// Build (once) and return a ToT block inside `container`. `label` names the
// reveal link; `live` marks it as an in-progress (pulsing) stream.
function makeToT(container,label,live){
  var tot=container.querySelector('.tot');
  if(tot)return tot;
  tot=document.createElement('div');tot.className='tot'+(live?' tot-live':'');
  tot.innerHTML='<div class="tot-toggle"><span class="chev"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><path d="m9 6 6 6-6 6"/></svg></span><span class="tot-label"></span></div><div class="tot-window"></div>';
  tot.querySelector('.tot-label').textContent=label||'Reveal train of thought';
  tot.querySelector('.tot-toggle').onclick=function(){tot.classList.toggle('open');var w=tot.querySelector('.tot-window');if(tot.classList.contains('open'))w.scrollTop=w.scrollHeight};
  var meta=container.querySelector('.msg-meta');
  if(meta)container.insertBefore(tot,meta);else container.appendChild(tot);
  return tot;
}
// Append reasoning text to a ToT window.
function totPush(tot,text){
  var w=tot.querySelector('.tot-window');if(!w)return;
  totSet(tot,(w._raw||'')+text);
}
// Set the full reasoning text of a ToT window at once. It renders like a reply (same
// sanitized Markdown): a live window at most every 80 ms, a finished one at once.
function totSet(tot,text){
  var w=tot.querySelector('.tot-window');if(!w)return;
  w._raw=String(text==null?'':text);
  if(tot.classList.contains('tot-live'))mdStream(w,{onRender:function(){w.scrollTop=w.scrollHeight}}).update(w._raw);
  else{mdRender(w,w._raw);w.scrollTop=w.scrollHeight}
}
// Flatten crew progress items into one continuous reasoning stream.
function stepsToText(steps){
  var out=[];
  for(var i=0;i<steps.length;i++){
    var st=steps[i];out.push((typeof st==='string')?st:(st&&(st.text||st.message||st.step))||JSON.stringify(st));
  }
  return out.join('\n');
}
// Mark a live ToT as finished (stop the pulse, relabel).
function totFinalize(tot,label){
  if(!tot)return;tot.classList.remove('tot-live');
  var l=tot.querySelector('.tot-label');if(l&&label)l.textContent=label;
}
// Parse the Think-mode scaffold output into {think, answer} for streaming render.
// Model emits: <thinking>reasoning</thinking>\n### FINAL ANSWER:\nanswer
// While thinking is still open, answer stays empty (bubble keeps its indicator).
function parseScaffold(raw){
  var think='',answer='',open=false;
  var oi=raw.indexOf('<thinking>');
  if(oi!==-1){
    var ci=raw.indexOf('</thinking>',oi);
    if(ci!==-1){
      think=raw.slice(oi+10,ci);
      var rest=raw.slice(ci+11);
      var fm=rest.match(/###\s*FINAL ANSWER:?/i);
      answer=fm?rest.slice(fm.index+fm[0].length):'';   // wait for the marker before showing
    }else{think=raw.slice(oi+10);open=true;}            // thinking still streaming
  }else{
    var fm2=raw.match(/###\s*FINAL ANSWER:?/i);
    answer=fm2?raw.slice(fm2.index+fm2[0].length):raw;  // no scaffold (concise mode) -> raw
  }
  return {think:think,answer:answer,open:open};
}

function _chatFromHash(){

function addMessage(role,content,animate,ts,quiet){

  // Each row keeps its own time: the saved timestamp when a session is restored
  // (the server writes 6 fractional digits; trim to 3 so every browser parses it),
  // the moment it was added for a live message. Another day also shows the date.

  if(!isNaN(at)){

  // SyntaxError. The click then silently did nothing, on every message containing
  // an apostrophe (i.e. most of them), on desktop AND phone — the PWA's Chat link
  // serves this same file. Buttons are emitted bare and bound below via closures,
  // which needs no escaping and makes message content non-executable by design.
  // Same contract as bindCopyButtons() in codec_dashboard.html.
  var copyBtn='<button class="msg-act msg-copy" data-act="copy" title="Copy" aria-label="Copy"><svg class="ico ico-sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button>';
  var editBtn=role==='user'?'<button class="msg-act msg-edit" data-act="edit" title="Edit &amp; re-send" aria-label="Edit and re-send"><svg class="ico ico-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>':'';
  var regenBtn=role==='assistant'?'<button class="msg-act msg-regen" onclick="regenerateResponse(this)" title="Regenerate" aria-label="Regenerate"><svg class="ico ico-sm" viewBox="0 0 24 24" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg></button>':'';

  var speakBtn=role==='assistant'?'<button class="msg-act msg-speak" data-act="speak" title="Speak" aria-label="Speak"><svg class="ico ico-sm" viewBox="0 0 24 24" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg></button>':'';

  var actions=regenBtn+editBtn+copyBtn+speakBtn;

  (function(host,txt){

// Play Kokoro TTS for any text — used by per-message Speak button + voice-reply autoplay
var _ttsAudio = null;
function speakMessage(text, btn){
  if (!text) return;
  // Stop any in-flight playback (prevents pile-up)
  if (_ttsAudio) { try { _ttsAudio.pause(); } catch(e){} _ttsAudio = null; }
  // Trim to ~500 chars (TTS endpoint caps internally too)
  var snippet = String(text).slice(0, 500);
  var url = '/api/tts?text=' + encodeURIComponent(snippet);
  _ttsAudio = new Audio(url);
  if (btn) btn.classList.add('speaking');
  _ttsAudio.onended = function(){ if (btn) btn.classList.remove('speaking'); _ttsAudio = null; };
  _ttsAudio.onerror = function(){ if (btn) btn.classList.remove('speaking'); _ttsAudio = null; };

}

function editMessage(text,btn){

  for(var i=chatHist.length-1;i>=0;i--){

// ───────────────────────────────────────────────────────────────────────────
// PR #39 — Agent plan persistence (Project mode)
// ───────────────────────────────────────────────────────────────────────────
// Why this exists: Phase 3.5 saved only the bare string "Project drafted:
// agent_xxx" to chat history; the inline card with approve/reject/view-plan
// buttons lived only in the DOM. Reloading the chat lost the card.
//
// Approach: persist a marker token `[CODEC_AGENT_PLAN:<id>]` inside the
// assistant message content. On chat session load, scan rendered messages,
// detect the marker, fetch the agent state, and replace the text bubble
// with the same card the live flow renders.
//
// The card's button callbacks (approveAgentInChat / rejectAgentInChat /
// viewAgentPlan) only need agent_id, so reload-time rendering matches the
// live render exactly. Status-aware buttons (e.g. "Resume" on
// blocked_on_qwen) come for free via the agent state object.
var AGENT_PLAN_MARKER_RE=/\[CODEC_AGENT_PLAN:(agent_[a-z0-9]+)\]/;

function extractAgentIdFromMessage(content){
  if(!content||typeof content!=='string')return null;
  var m=content.match(AGENT_PLAN_MARKER_RE);
  return m?m[1]:null;
}

function renderAgentPlanCard(agentId,agentInfo){

  //   - POST /api/agents result: {agent_id, status, project_dir} (flat)

  // Normalize both into the same view-model.
  agentInfo=agentInfo||{};

  var status=manifest.status||'';
  var reason=manifest.status_reason||'';
  var projectDir=manifest.project_dir||'';

    '</div>';

  // approve+reject+view; running/done/aborted = view-only; blocked_* =
  // resume+abort+view.

  var isPendingApproval=(!status)||status==='draft_pending'||status==='awaiting_approval';
  var isBlocked=status&&status.indexOf('blocked_')===0;
  var isTerminal=status==='done'||status==='aborted'||status==='plan_failed';
  if(isPendingApproval){
    buttonsHtml=
      '<button onclick="approveAgentInChat(\''+agentId+'\',event)" style="padding:6px 14px;background:var(--accent);color:var(--on-accent);border:none;border-radius:6px;cursor:pointer;font-size:calc(12px * var(--fs-scale));font-weight:600">Approve plan</button>'+

      '<button onclick="viewAgentPlan(\''+agentId+'\',event)" style="padding:6px 14px;background:transparent;color:var(--text);border:1px solid var(--border,#2a2a30);border-radius:6px;cursor:pointer;font-size:calc(12px * var(--fs-scale))">View plan</button>';
  }else if(isBlocked){
    buttonsHtml=
      '<button onclick="viewAgentPlan(\''+agentId+'\',event)" style="padding:6px 14px;background:var(--accent);color:var(--on-accent);border:none;border-radius:6px;cursor:pointer;font-size:calc(12px * var(--fs-scale));font-weight:600">View plan + resolve</button>'+
      '<button onclick="rejectAgentInChat(\''+agentId+'\',event)" style="padding:6px 14px;background:transparent;color:var(--text);border:1px solid var(--border,#2a2a30);border-radius:6px;cursor:pointer;font-size:calc(12px * var(--fs-scale))">Abort</button>';
  }else{

// When Qwen finds a project description too vague, it now asks 1-3 clarifying
// questions THROUGH THIS CONVERSATION instead of drafting a bad plan — the
// mechanism (codec_ask_user) existed but was wired with the wrong function
// signature and would crash the instant it fired; fixed server-side. Rendered

var _answeredQuestionIds={};
function renderClarifyingQuestion(container,pendingQuestionId,questionText){

    '<button onclick="answerClarifyingQuestion(\''+pendingQuestionId+'\',this)" style="padding:7px 14px;background:var(--accent);color:var(--on-accent);border:none;border-radius:8px;cursor:pointer;font-size:calc(12px * var(--fs-scale));font-weight:600">Answer</button>'+

async function answerClarifyingQuestion(pendingQuestionId,btn){

      method:'POST',headers:{'Content-Type':'application/json'},

// Poll a just-drafted (or clarifying) agent until it reaches awaiting_approval
// or plan_failed. Renders clarifying questions conversationally as they show
// up, then swaps the "drafting..." bubble for the real plan card.
async function pollDraftingAgent(agentId,pendingDiv){
  var messagesEl=document.getElementById('messages');
  for(var i=0;i<150;i++){                          // ~150 * 2s = 5min safety cap
    await new Promise(function(res){setTimeout(res,2000)});
    var st='';
    try{
      var r=await fetch('/api/agents/'+encodeURIComponent(agentId));
      if(!r.ok)continue;
      var d=await r.json();
      st=(d.manifest||{}).status||'';
      if(st==='awaiting_approval'){
        pendingDiv.querySelector('.msg-bubble').innerHTML=renderAgentPlanCard(agentId,d);
        var planMarker='[CODEC_AGENT_PLAN:'+agentId+']';
        var planText='Here’s my plan — agent_id '+agentId+'  '+planMarker;
        chatHist.push({role:'assistant',content:planText});
        saveMessages([{role:'assistant',content:planText}]);
        setActiveAgent(agentId);
        return;
      }
      if(st==='plan_failed'){
        var reason=(d.manifest||{}).status_reason||'unknown reason';
        pendingDiv.querySelector('.msg-bubble').innerHTML=
          'I couldn’t turn that into a plan (<span style="color:var(--text-dim)">'+escHtml(reason)+'</span>). '+
          'Want to describe it a bit differently, or give me more specifics?';
        return;
      }
    }catch(e){continue}
    // While drafting, check for a clarifying question aimed at this agent.
    try{
      var qr=await fetch('/api/agents/pending_questions');
      if(qr.ok){
        var qd=await qr.json();
        var qs=(qd.pending_questions||qd.questions||[]);
        for(var j=0;j<qs.length;j++){
          var q=qs[j];
          if(q.agent==='agent_plan:'+agentId&&!_answeredQuestionIds[q.id]){
            _answeredQuestionIds[q.id]='pending';   // render-once guard
            renderClarifyingQuestion(messagesEl,q.id,q.question);
          }
        }
      }
    }catch(e){}
  }
  pendingDiv.querySelector('.msg-bubble').innerHTML='Still working on this one — check back in a bit, or ask me for a status update.';
}

async function rehydrateAgentPlanCards(){
  // Called after loadSession finishes rendering text messages. Scan
  // assistant bubbles for the marker, fetch each agent in parallel,
  // replace the bubble with the rendered card. Failures fall back
  // to leaving the marker text visible (so the user knows something
  // is missing rather than seeing nothing).
  var msgs=document.querySelectorAll('#messages .msg.assistant .msg-bubble');
  var jobs=[];
  for(var i=0;i<msgs.length;i++){
    var bubble=msgs[i];
    var agentId=extractAgentIdFromMessage(bubble.textContent||'');
    if(!agentId)continue;
    jobs.push((function(b,id){
      return fetch('/api/agents/'+id).then(function(r){
        return r.ok?r.json():null;
      }).then(function(info){
        // GET /api/agents/<id> returns {manifest, plan, state, grants}.
        // Treat presence of manifest.agent_id as "agent exists".
        var ok=info&&info.manifest&&info.manifest.agent_id;
        if(ok){
          b.classList.remove('md');b.innerHTML=renderAgentPlanCard(id,info);
          var st=(info.manifest||{}).status||'';
          if(['running','approved','paused','blocked_on_permission','blocked_on_qwen'].indexOf(st)>=0){
            // Resume live polling if agent is still running
            _startAgentPoller(id);
          } else if(['completed','aborted','crashed'].indexOf(st)>=0){
            // Agent finished — catch up on any messages the poller may have missed
            _injectMissedAgentMessages(id);
          }
        }else{
          // Agent missing (e.g. manifest deleted); show inline notice
          // but keep the agent_id visible so the user knows what's gone.
          b.classList.remove('md');b.innerHTML='<div style="font-weight:600;margin-bottom:4px">Project: '+escHtml(id)+'</div>'+
            '<div style="color:var(--text-dim);font-size:calc(12px * var(--fs-scale))">Agent state not found — manifest may have been removed.</div>';
        }
      }).catch(function(){/* keep raw text on error */});
    })(bubble,agentId));
  }
  if(jobs.length){await Promise.all(jobs)}
}

var _currentAbort=null;
// Agent/crew run handles — set while a Deep Research/crew job is polling so the
// Stop button can cancel it (crews can't be killed mid-run, so this stops the
// UI waiting AND flags the job cancelled server-side to ignore a late result).
var _agentJobId=null,_agentPoll=null,_agentTicker=null;

function stopGeneration(){
  // Stop halts the queue too: queued messages stay, marked "Kept", until Send.
  if(_queue.length){_queuePaused=true;_renderQueue();showToast('Stopped. Queued message kept: press Send to send it')}
  // An agent/crew run in progress takes priority over chat streaming.
  if(_agentJobId||_agentPoll||_agentTicker){
    if(_agentPoll){clearInterval(_agentPoll);_agentPoll=null}
    if(_agentTicker){clearInterval(_agentTicker);_agentTicker=null}

    hideTyping();_showSend();isProcessing=false;document.getElementById('sendBtn').disabled=false;return
  }

}
// A stopped or failed stream keeps the answer that already arrived: the streamed
// buffer's answer part (never the unfinished reasoning), marked "(stopped)", goes
// into the bubble, chatHist and the saved session. `div` is the streaming bubble;
// once a finished reply replaced it, it is detached and nothing is added twice.
function _keepPartial(raw,div){
  if(!div||!div.isConnected)return;
  var pp=parseScaffold(raw||'');
  var ans=raw?((pp.answer&&pp.answer.trim())||raw.replace(/<thinking>[\s\S]*?<\/thinking>/i,'').replace(/<thinking>[\s\S]*$/i,'').replace(/###\s*FINAL ANSWER:?/i,'').replace(/<\/?final\s*answer>/gi,'').trim()):'';
  // Stopped before any answer text: drop the "thinking" placeholder bubble.
  if(!ans){div.remove();return}
  var txt=ans+'\n\n(stopped)';
  var md=addMessage('assistant',txt,false,null,true);
  if(div.parentNode){div.parentNode.insertBefore(md,div);div.remove()}
  if(thinkingEnabled&&pp.think&&pp.think.trim()){var fp=makeToT(md,'Train of thought',false);totSet(fp,pp.think.trim())}
  chatHist.push({role:'assistant',content:txt});saveMessages([{role:'assistant',content:txt}]);
}

async function sendMessage(queued){
  var input=document.getElementById('chatInput');
  var direct=typeof queued==='string';
  if(isProcessing){
    var qt=direct?queued.trim():input.value.trim();
    if(qt){_queue.push(qt);if(!direct){input.value='';_autosize(input)}_renderQueue()}
    return;
  }
  var text;
  if(direct){text=queued.trim()}
  else{
    text=input.value.trim();
    if(!text&&!pendingFiles.length){
      // Empty composer: Send releases a queue that Stop kept.
      if(!_queue.length)return;
      text=_queue.shift();_renderQueue();
    }else{input.value='';input.style.height='auto'}
  }
  _queuePaused=false;
  if(!text&&!pendingFiles.length)return;
  _syncSendState();

  // Attachments are read HERE, before the mode branches. They used to be built
  // only in the chat path further down, which the project and research branches
  // return past — so a PDF attached in Agents or Project mode was silently
  // dropped: chips cleared, crew ran on the prompt alone, no error shown.
  var fileContext='';var fileNames=[];
  for(var i=0;i<pendingFiles.length;i++){var f=pendingFiles[i];fileNames.push(f.name);
    if(f.type==='text'||f.type==='pdf'){fileContext+='\n\n[DOCUMENT: '+f.name+']\n'+f.content.substring(0,80000)+'\n[END DOCUMENT]'}
    else if(f.type==='image'){fileContext+='\n\n[IMAGE ANALYSIS of '+f.name+']\n'+f.content.substring(0,80000)+'\n[END IMAGE]'}}

  // Image mode → local Qwen-Image 2.1 (codec_image). The text is the prompt,
  // the 'imgref' chips are the reference images.
  if(chatMode==='image'){return sendImage(text)}

  // Project mode → POST /api/agents (Step 8 plan dispatch)
  // OR if there's an active agent in this thread, route the message to that agent
  // (status queries, mid-run instructions). User explicitly exits with × on chip.
  if(chatMode==='project'){
    if(!text&&!fileNames.length)return;
    var projText=(text||'Please use the attached file(s).')+fileContext;
    if(fileNames.length)clearChips();
    addMessage('user',fileNames.length?(fileNames.join('\n')+'\n\n'+(text||'Please use the attached file(s).')):text);
    chatHist.push({role:'user',content:projText});
    saveMessages([{role:'user',content:text}]);
    isProcessing=true;document.getElementById('sendBtn').disabled=true;

    // ── Continuity branch: route to active agent if one is bound to this thread
    if(_activeAgentId){
      var replyDiv=document.createElement('div');
      replyDiv.className='msg assistant';
      replyDiv.innerHTML='<div class="msg-bubble" style="opacity:.7"><em>Sending to '+escHtml(_activeAgentId.slice(0,12))+'…</em></div>';
      document.getElementById('messages').appendChild(replyDiv);
      scrollBottom();
      try{
        var rr=await fetch('/api/agents/'+encodeURIComponent(_activeAgentId)+'/messages',{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({body:text})
        });
        if(rr.status===404){
          // Agent vanished (deleted / not found) — clear binding, fall through
          replyDiv.querySelector('.msg-bubble').innerHTML='<span style="color:var(--text-muted)">Agent no longer exists — exited conversation.</span>';
          setActiveAgent(null);
          isProcessing=false;document.getElementById('sendBtn').disabled=false;_showSend();
          return;
        }
        var rd=await rr.json();
        if(rd.ok){
          replyDiv.querySelector('.msg-bubble').innerHTML=
            'Sent to <code style="opacity:.7">'+escHtml(_activeAgentId.slice(0,12))+'</code> · agent will reply in-thread';
          chatHist.push({role:'assistant',content:'(message routed to active agent)'});
          // Start a brief poll for the agent's reply so the user sees response inline
          schedulePollAgentTimeline(_activeAgentId, replyDiv);
        }else{
          replyDiv.querySelector('.msg-bubble').innerHTML='<span style="color:var(--danger,#f87171)">Send failed:</span> '+escHtml(rd.detail||'unknown');
        }
      }catch(e){
        replyDiv.querySelector('.msg-bubble').innerHTML='<span style="color:var(--danger,#f87171)">Send failed:</span> '+escHtml(e.message);
      }finally{
        isProcessing=false;document.getElementById('sendBtn').disabled=false;_showSend();
      }
      return;
    }

    // ── No active agent: draft a new project. Drafting now runs server-side
    // in the background (see routes/agents.py) so a clarifying question never
    // hangs this request — POST returns almost immediately with agent_id +
    // status:draft_pending, and we poll from here, rendering any clarifying
    // question conversationally as it comes up.
    var pendingDiv=document.createElement('div');
    pendingDiv.className='msg assistant';
    pendingDiv.innerHTML='<div class="msg-bubble">Let me think through a plan for that…</div>';
    document.getElementById('messages').appendChild(pendingDiv);
    scrollBottom();
    try{
      var pr=await fetch('/api/agents',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({title:(text||fileNames.join(', ')).slice(0,80),description:projText})});
      if(pr.status===401||pr.status===403){
        pendingDiv.querySelector('.msg-bubble').innerHTML='<span style="color:var(--danger,#f87171)">Session expired</span> — refreshing...';

        refreshAgentStatusPills();

      }
    }catch(e){
      pendingDiv.querySelector('.msg-bubble').innerHTML='<span style="color:var(--danger,#f87171)">Failed:</span> '+escHtml(e.message);
    }finally{
      isProcessing=false;document.getElementById('sendBtn').disabled=false;

  }

  if(chatMode==='research'){
    var researchText=(text||'')+fileContext;
    var crew=document.getElementById('crewSelect').value||'deep_research';
    var noTextCrews=['daily_briefing','email_handler'];

    if(fileNames.length)clearChips();

    var crewLabels={'deep_research':'Deep Research','daily_briefing':'Daily Briefing',
      'trip_planner':'Trip Planner','competitor_analysis':'Competitor Analysis','email_handler':'Email Handler',
      'social_media':'Social Media','code_review':'Code Review','data_analysis':'Data Analysis',
      'content_writer':'Content Writer','meeting_summarizer':'Meeting Summarizer',
      'invoice_generator':'Invoice Generator','project_manager':'Project Manager',

    var userMsg=(crewLabels[crew]||crew)+': '+((text||'')||(fileNames.length?fileNames.join(', '):'(running)'));
    if(fileNames.length&&text)userMsg+=' ['+fileNames.join(', ')+']';
    addMessage('user',userMsg);chatHist.push({role:'user',content:userMsg});saveMessages([{role:'user',content:userMsg}]);

    var statusEl=null;
    function updateStatus(msg){
      if(!statusEl){var es=document.getElementById('emptyState');if(es)es.remove();var div=document.createElement('div');div.className='msg assistant';div.innerHTML='<div class="msg-bubble" id="agentStatus"></div>';document.getElementById('messages').appendChild(div);statusEl=document.getElementById('agentStatus');
        // Small inline Stop button right under the running status (in addition to the composer Stop).
        var sb=document.createElement('button');sb.className='status-stop';sb.type='button';sb.innerHTML='<svg class="ico ico-sm" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>Stop';sb.onclick=stopGeneration;div.appendChild(sb)}
