    var crewHints={'deep_research':'Searching the web \u2192 analyzing sources \u2192 writing report...','daily_briefing':'Checking calendar, weather, news...','trip_planner':'Researching destination \u2192 building itinerary...','competitor_analysis':'Scouting competitors \u2192 writing analysis...','email_handler':'Reading inbox \u2192 drafting replies...','custom':'Running custom agent...'};
    updateStatus('Starting '+(crewLabels[crew]||crew)+'&hellip;\n\n'+(crewHints[crew]||'Running agent...'));

    var payload={crew:crew};
    if(crew==='custom'){payload.agent_name=document.getElementById('agentName').value||'Custom Agent';payload.role=document.getElementById('agentRole').value||'';payload.tools=getSelectedTools();payload.max_iterations=parseInt(document.getElementById('agentMaxIter').value||'8');payload.task=researchText}else{if(['deep_research','competitor_analysis'].includes(crew))payload.topic=researchText;if(crew==='deep_research'){var _rm=document.getElementById('researchModelSelect');if(_rm&&_rm.value)payload.model=_rm.value}if(crew==='trip_planner')payload.destination=researchText}

    var elapsed=0;
    _agentTicker=setInterval(function(){elapsed+=5;updateStatus(crewLabels[crew]+' running&hellip; ('+elapsed+'s)  \u2014 press Stop to cancel\n\n'+(crewHints[crew]||''))},5000);

    try{

      var jobId=startData.job_id;_agentJobId=jobId;

        // Train-of-thought: stream the crew's live step log as one continuous feed under the status.
        if(sd.progress&&sd.progress.length&&statusEl){var lp=makeToT(statusEl.parentElement,'Reveal train of thought',true);totSet(lp,stepsToText(sd.progress))}
        if(sd.status!=='running'){clearInterval(_agentPoll);_agentPoll=null;resolve(sd)}}catch(pe){clearInterval(_agentPoll);_agentPoll=null;reject(pe)}},4000)});
      clearInterval(_agentTicker);_agentTicker=null;_agentJobId=null;if(statusEl)statusEl.parentElement.remove();
      // User pressed Stop after the crew already reported terminal \u2014 honor it.
      if(data.status==='cancelled'){isProcessing=false;_showSend();document.getElementById('sendBtn').disabled=false;return}
      var resultMsg;var reportDocUrl=null;
      if(data.status==='complete'){var result=data.result||'';var docMatch=result.match(/https:\/\/docs\.google\.com\/\S+/);if(docMatch){reportDocUrl=docMatch[0].replace(/[)\].,]+$/,'');var summary=result.replace(docMatch[0],'').trim();if(!summary)summary='Your report has been generated and saved to Google Docs.';resultMsg='**'+crewLabels[crew]+' Complete!** ('+data.elapsed_seconds+'s)\n\n'+summary+'\n\n[Open in Google Docs]('+reportDocUrl+')'}else{resultMsg='**'+crewLabels[crew]+' Complete!** ('+data.elapsed_seconds+'s)\n\n'+result}}else{resultMsg='Agent error: '+(data.error||'Unknown error')}

  }

  var displayText=text;
  if(fileNames.length){displayText=(fileNames.map(function(n){return n}).join('\n'))+'\n\n'+(text||'Please analyze the attached file(s).')}
  addMessage('user',displayText);
  var imageData=[];
  var llmText=(text||'Please analyze the attached file(s).')+fileContext;
  chatHist.push({role:'user',content:llmText});clearChips();
  saveMessages([{role:'user',content:displayText}]);
  var hasImages=imageData.length>0;
  isProcessing=true;document.getElementById('sendBtn').disabled=true;_showStop();showTyping();
  _currentAbort=new AbortController();
  try{
    var msgs=[{role:'system',content:buildSystem()}].concat(chatHist);var r;
    if(hasImages){
      r=await fetch('/api/vision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:msgs[msgs.length-1].content||'Describe this image in detail',image:imageData[0]}),signal:_currentAbort.signal});
      var data=await r.json();hideTyping();
      if(data.response){addMessage('assistant',data.response);chatHist.push({role:'assistant',content:data.response});saveMessages([{role:'assistant',content:data.response}])}
      else{addMessage('assistant','Error: '+(data.error||'No response'))}
    } else {
      r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,force_search:webSearchEnabled,thinking:false,show_thoughts:false,reason_scaffold:thinkingEnabled,stream:true,workdir:_workdir}),signal:_currentAbort.signal});
      if(r.status===401||r.status===403){hideTyping();addMessage('assistant','Session expired — redirecting to login...');setTimeout(function(){window.location.href='/auth'},1500);isProcessing=false;_showSend();document.getElementById('sendBtn').disabled=false;return}
      hideTyping();_lastStats=null;
      // SSE streaming — parse the Think-mode scaffold as tokens arrive
      var reader=r.body.getReader();var decoder=new TextDecoder();var raw='';var bubbleId='stream_'+genId();
      var es=document.getElementById('emptyState');if(es)es.remove();
      var div=document.createElement('div');div.className='msg assistant';div.innerHTML='<div class="msg-bubble md" id="'+bubbleId+'"><div class="thinking-indicator"><div class="thinking-dots"><span></span><span></span><span></span></div>CODEC is thinking...</div></div>';document.getElementById('messages').appendChild(div);
      var bubble=document.getElementById(bubbleId);var buf='';var answerStream=null;
      while(true){
        var chunk=await reader.read();
        if(chunk.done)break;
        buf+=decoder.decode(chunk.value,{stream:true});
        var lines=buf.split('\n');buf=lines.pop();
        for(var li=0;li<lines.length;li++){
          var line=lines[li].trim();
          if(!line.startsWith('data: '))continue;
          var payload=line.substring(6);
          if(payload==='[DONE]')break;
          try{var j=JSON.parse(payload);if(j.stats){_lastStats=j.stats}if(j.token){raw+=j.token;var ps=parseScaffold(raw);if(thinkingEnabled&&ps.think){var tp2=makeToT(div,'Reveal train of thought',true);totSet(tp2,ps.think)}if(ps.answer){(answerStream||(answerStream=mdStream(bubble,{onRender:scrollBottom}))).update(ps.answer)}scrollBottom()}if(j.escalate_project){renderEscalateChip(j.escalate_project,text)}if(j.skill_confirm){renderSkillConfirmChip(j.skill_confirm,text)}if(j.error){raw+='\n\nError: '+j.error}}catch(pe){}
        }
      }
      var pf2=parseScaffold(raw);
      // Same fallback order as the primary handler: never dump an unclosed
      // <thinking> tail into the bubble; keep reasoning in the reveal panel.
      var answer2=(pf2.answer&&pf2.answer.trim())||raw.replace(/<thinking>[\s\S]*?<\/thinking>/i,'').replace(/<thinking>[\s\S]*$/i,'').replace(/###\s*FINAL ANSWER:?/i,'').replace(/<\/?final\s*answer>/gi,'').trim();
      if(!answer2&&pf2.think&&pf2.think.trim()){answer2='*My reasoning ran on without reaching a final answer — a local-model glitch, not a real reply. The train of thought is below; please ask again.*'}
      if(answer2){div.remove();var md2=addMessage('assistant',answer2);if(thinkingEnabled&&pf2.think&&pf2.think.trim()&&md2){var fp2=makeToT(md2,'Train of thought',false);totSet(fp2,pf2.think.trim())}if(md2&&_lastStats)renderStats(md2,_lastStats);_lastStats=null;chatHist.push({role:'assistant',content:answer2});saveMessages([{role:'assistant',content:answer2}])}
      else{if(answerStream)answerStream.cancel();bubble.innerHTML='<em style="color:var(--text-dim)">No response</em>'}
    }
  }catch(e){
    hideTyping();
    if(e.name==='AbortError'){
      // User clicked stop — keep partial response
      _keepPartial(raw,div);
    }else{addMessage('assistant','Error: '+e.message)}
  }
  _currentAbort=null;isProcessing=false;_showSend();document.getElementById('sendBtn').disabled=false
}

// Downscale big photos client-side before upload so the vision model isn't
// choked by a full-res phone image (a 4 MB shot -> ~200 KB -> far faster analysis).
function _downscaleImage(file,maxDim){
  return new Promise(function(resolve){
    var reader=new FileReader();
    reader.onload=function(){
      var img=new Image();
      img.onload=function(){
        var w=img.width,h=img.height;
        if(w<=maxDim&&h<=maxDim){resolve(reader.result.split(',')[1]);return}
        var scale=Math.min(maxDim/w,maxDim/h);
        var cv=document.createElement('canvas');cv.width=Math.round(w*scale);cv.height=Math.round(h*scale);
        try{cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);resolve(cv.toDataURL('image/jpeg',0.85).split(',')[1])}
        catch(e){resolve(reader.result.split(',')[1])}
      };
      img.onerror=function(){resolve(reader.result.split(',')[1])};
      img.src=reader.result;
    };
    reader.onerror=function(){resolve('')};
    reader.readAsDataURL(file);
  });
}

// ── Paste image into chat (Cmd+V on a screenshot) ──
// Document-level so paste anywhere on the chat page is caught — without
// this, the user has to click into chatInput first before Cmd+V works
// (and most don't). Walks both clipboardData.files (newer) and
// clipboardData.items (older); accepts any image/* MIME type. Routes the
// image through handleUpload — same flow as drag-drop or the file picker.
function _chatExtractPastedImage(e){
  if(!e.clipboardData) return null;
  var files=e.clipboardData.files;
  if(files && files.length){
    for(var i=0;i<files.length;i++){
      var f=files[i];
      if(f && f.type && f.type.indexOf('image/')===0) return f;
    }
  }
  var items=e.clipboardData.items;
  if(items && items.length){
    for(var j=0;j<items.length;j++){
      var it=items[j];
      if(it && it.type && it.type.indexOf('image/')===0
         && typeof it.getAsFile==='function'){
        var got=it.getAsFile();
        if(got) return got;
      }
    }
  }
  return null;
}

document.addEventListener('paste',function(e){
  var img=_chatExtractPastedImage(e);
  if(img){
    e.preventDefault();
    try{
      var ext=(img.type.split('/')[1]||'png').split('+')[0];
      var renamed=new File([img],'pasted-'+Date.now()+'.'+ext,{type:img.type});
      var dt=new DataTransfer();
      dt.items.add(renamed);
      var fi=document.getElementById('fileUp');
      fi.files=dt.files;
      handleUpload({target:fi});
      try{showToast('Screenshot pasted')}catch(_e){}
      var ci=document.getElementById('chatInput');
      if(ci) ci.focus();
    }catch(err){
      console.warn('Paste image into chat failed:',err);
    }
    return;
  }
  // Text paste anywhere → drop it into the composer (no need to click in first).
  var t=e.target,tag=(t&&t.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA'||(t&&t.isContentEditable))return;
  var txt=e.clipboardData&&e.clipboardData.getData('text');
  if(txt){
    var cin=document.getElementById('chatInput');
    if(cin){
      e.preventDefault();cin.focus();
      var a=cin.selectionStart!=null?cin.selectionStart:cin.value.length;
      var b=cin.selectionEnd!=null?cin.selectionEnd:cin.value.length;
      cin.value=cin.value.slice(0,a)+txt+cin.value.slice(b);
      cin.selectionStart=cin.selectionEnd=a+txt.length;
      cin.dispatchEvent(new Event('input'));
    }
  }
},true);

<!-- Phase 3.5 Step 11 — Project mode agent action handlers + status pills -->
<script>
// ── Agent live-update poller ────────────────────────────────────────────────
// Handle action buttons on agent done/blocked messages
// Infer the grant "kind" from a block reason/title (backend leaves it as a placeholder).
function _grantKind(reason){
  reason=(reason||'').toLowerCase();
  if(reason.indexOf('domain')>=0)return 'network_domains';
  if(reason.indexOf('skill')>=0)return 'skills';
  if(reason.indexOf('write')>=0)return 'write_paths';
  if(reason.indexOf('read')>=0)return 'read_paths';
  return 'network_domains';
}
async function _agentAction(endpoint,bodyEnc){
  try{
    var opts={method:'POST'};
    var bodyObj=null;
    if(bodyEnc){bodyObj=JSON.parse(decodeURIComponent(bodyEnc));opts.headers={'Content-Type':'application/json'};opts.body=JSON.stringify(bodyObj);}
    var r=await fetch(endpoint,opts);
    var d=await r.json();
    // Grant flow: report success/failure and let the agent resume (backend flips it to running).
    if(endpoint.indexOf('/grant')>=0){
      if(r.ok){showToast('Permission granted — agent resuming');addMessage('assistant','Granted `'+((bodyObj&&bodyObj.value)||'')+'` — the agent will continue from where it stopped.');}
      else{addMessage('assistant','Grant failed: '+(d.detail||d.error||('HTTP '+r.status)));}
      return;
    }
    if(d.files){
      // artifacts list — show inline
      var list=d.files.map(function(f){
        var kb=f.size<1024?f.size+' B':(f.size/1024).toFixed(1)+' KB';
        return '  • '+f.name+' ('+kb+')';
      }).join('\n');
      addMessage('assistant',''+d.project_dir+'\n'+list);
    }else if(d.opened||d.ok){
      // open-folder succeeded silently
    }else if(d.error){
      addMessage('assistant','Error: '+d.error);
    }
  }catch(e){addMessage('assistant','Action failed: '+e.message)}
}

// Inject agent messages that were missed (e.g. agent completed while user was away).
// Checks chatHist to avoid duplicates — only injects titles not already present.
async function _injectMissedAgentMessages(agentId){
  try{
    var mr=await fetch('/api/agents/'+encodeURIComponent(agentId)+'/messages');
    if(!mr.ok)return;
    var md=await mr.json();
    var msgs=md.messages||[];
    for(var mi=0;mi<msgs.length;mi++){
      var m=msgs[mi];
      var title=m.title||m.type||'';
      // Skip if this message is already in chatHist (survived from live poller or prior load)
      var alreadySaved=chatHist.some(function(h){return h.content&&h.content.indexOf(title)>=0});
      if(alreadySaved)continue;
      var icon=m.type==='agent_done'?'done':m.type==='agent_aborted'?'stopped':'running';
      var bubble=document.createElement('div');bubble.className='msg assistant';
      var titleHtml='<div style="font-weight:600;margin-bottom:6px">'+icon+' '+escHtml(title)+'</div>';
      var bodyHtml=m.body?'<div style="font-size:calc(13px * var(--fs-scale));color:var(--text-dim);white-space:pre-wrap">'+escHtml(m.body)+'</div>':'';
      var actionsHtml='';
      if(m.actions&&m.actions.length){
        actionsHtml='<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">';
        m.actions.forEach(function(a){actionsHtml+='<button onclick="_agentAction(\''+escHtml(a.endpoint)+'\')" style="padding:5px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:calc(12px * var(--fs-scale));color:var(--text)">'+escHtml(a.label)+'</button>';});
        actionsHtml+='</div>';
      }
      bubble.innerHTML='<div class="msg-bubble" style="border-left:3px solid var(--accent);padding-left:10px">'+titleHtml+bodyHtml+actionsHtml+'</div>';
      document.getElementById('messages').appendChild(bubble);
      var msgText=icon+' '+title+(m.body?'\n'+m.body:'');
      chatHist.push({role:'assistant',content:msgText});
      saveMessages([{role:'assistant',content:msgText}]);
    }
    if(msgs.length)scrollBottom();
  }catch(e){}
}

// After plan approval, poll /api/agents/<id>/messages every 5s and inject
// any new agent_update / agent_done / agent_aborted messages into the chat.
var _agentPollers={};  // agentId → intervalId
function _startAgentPoller(agentId){
  if(_agentPollers[agentId])return;  // already running
  var seen=new Set();
  var pollId=setInterval(async function(){
    try{
      // Fetch messages
      var mr=await fetch('/api/agents/'+encodeURIComponent(agentId)+'/messages');
      if(!mr.ok)return;
      var md=await mr.json();
      var msgs=md.messages||[];
      var newMsgs=msgs.filter(function(m){return!seen.has(m.ts+m.type)});
      for(var mi=0;mi<newMsgs.length;mi++){
        var m=newMsgs[mi];
        seen.add(m.ts+m.type);
        var icon=m.type==='agent_done'?'done':m.type==='agent_aborted'?'stopped':'running';
        var bubble=document.createElement('div');bubble.className='msg assistant';
        var titleHtml='<div style="font-weight:600;margin-bottom:6px">'+icon+' '+escHtml(m.title||m.type)+'</div>';
        // Body: preserve newlines
        var bodyHtml=m.body?'<div style="font-size:calc(13px * var(--fs-scale));color:var(--text-dim);white-space:pre-wrap">'+escHtml(m.body)+'</div>':'';
        // Action buttons (Open folder, View files)
        var actionsHtml='';
        if(m.actions&&m.actions.length){
          actionsHtml='<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">';
          m.actions.forEach(function(a){
            var bodyEnc='';
            if(a.body_hint){
              var kind=a.body_hint.kind;
              if(!kind||kind.indexOf('<')>=0)kind=_grantKind(m.title||m.body);
              bodyEnc=encodeURIComponent(JSON.stringify({kind:kind,value:a.body_hint.value}));
            }
            var isGrant=(a.endpoint||'').indexOf('/grant')>=0;
            var bg=isGrant?'var(--accent)':'var(--surface-2)';var fg=isGrant?'var(--on-accent)':'var(--text)';
            actionsHtml+='<button onclick="_agentAction(\''+escHtml(a.endpoint)+'\',\''+bodyEnc+'\')" style="padding:5px 12px;background:'+bg+';border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:calc(12px * var(--fs-scale));color:'+fg+'">'+escHtml(a.label)+'</button>';
          });
          actionsHtml+='</div>';
        }
        bubble.innerHTML='<div class="msg-bubble" style="border-left:3px solid var(--accent);padding-left:10px">'+titleHtml+bodyHtml+actionsHtml+'</div>';
        document.getElementById('messages').appendChild(bubble);
        scrollBottom();
        // Persist to qchat so messages survive page reload
        var msgText=icon+' '+(m.title||m.type)+(m.body?'\n'+m.body:'');
        chatHist.push({role:'assistant',content:msgText});
        saveMessages([{role:'assistant',content:msgText}]);
      }
      // Check status — stop polling when terminal
      var sr=await fetch('/api/agents/'+encodeURIComponent(agentId));
      if(!sr.ok)return;
      var sd=await sr.json();
      var status=(sd.manifest||{}).status||'';
      if(['completed','aborted','crashed'].indexOf(status)>=0){
        clearInterval(pollId);delete _agentPollers[agentId];
        refreshAgentStatusPills();
      }
    }catch(e){}
  },5000);
  _agentPollers[agentId]=pollId;
}

async function approveAgentInChat(agentId,e){
  if(e)e.preventDefault();
  if(!confirm('Approve plan for '+agentId+'?\n\nThe agent will run autonomously with the manifest permissions.'))return;
  try{
    var r=await fetch('/api/agents/'+encodeURIComponent(agentId)+'/approve',{method:'POST'});
    if(r.ok){
      var div=document.createElement('div');div.className='msg assistant';
      div.innerHTML='<div class="msg-bubble"><span style="color:var(--running)">Plan approved.</span> codec-agent-runner picks it up within 5s. Updates will appear here as checkpoints complete.</div>';
      document.getElementById('messages').appendChild(div);scrollBottom();
      saveMessages();
      _startAgentPoller(agentId);  // begin live updates in this thread
    }else{
      var d=await r.json().catch(function(){return{}});
      showToast('Approval failed: '+(d.detail||r.status));
    }
  }catch(err){showToast('Approval error: '+err.message)}
  refreshAgentStatusPills();
}
async function rejectAgentInChat(agentId,e){
  if(e)e.preventDefault();
  var reason=prompt('Reason for rejection (optional):','');
  if(reason===null)return;
  try{
    var r=await fetch('/api/agents/'+encodeURIComponent(agentId)+'/reject',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:reason||''})});
    if(r.ok){showToast('Plan rejected.')}else{showToast('Reject failed')}
  }catch(err){showToast('Error: '+err.message)}
  refreshAgentStatusPills();
}
async function viewAgentPlan(agentId,e){
  if(e)e.preventDefault();
  try{
    var r=await fetch('/api/agents/'+encodeURIComponent(agentId));
    if(!r.ok){showToast('Failed to load plan: '+r.status);return}
    var d=await r.json();
    var plan=d.plan||{};

      html+='<ul style="margin:0 0 8px;padding-left:18px;font-size:calc(13px * var(--fs-scale))">';
      plan.goals.forEach(function(g){html+='<li>'+escHtml(g)+'</li>'});
      html+='</ul>';
    }
    if(plan.checkpoints&&plan.checkpoints.length){

      html+='<ol style="margin:0 0 8px;padding-left:18px;font-size:calc(13px * var(--fs-scale))">';
      plan.checkpoints.forEach(function(cp){html+='<li><b>'+escHtml(cp.title||'')+'</b>: '+escHtml((cp.description||'').slice(0,200))+'</li>'});
      html+='</ol>';
    }
    html+='<div style="font-weight:600;margin:8px 0 4px;font-size:calc(13px * var(--fs-scale));color:var(--text-dim)">Permission manifest</div>';
    html+='<div style="font-size:calc(12px * var(--fs-scale));background:rgba(0,0,0,0.2);padding:8px;border-radius:6px;font-family:var(--font-mono,monospace)">';
    html+='skills: '+escHtml((manifest.skills||[]).join(', ')||'(none)')+'<br>';
    html+='network_domains: '+escHtml((manifest.network_domains||[]).join(', ')||'(none)')+'<br>';
    html+='write_paths: '+escHtml((manifest.write_paths||[]).join(', ')||'(none)')+'<br>';
    html+='destructive_ops: '+escHtml((manifest.destructive_ops||[]).join(', ')||'(none)');
    html+='</div></div>';
    var div=document.createElement('div');div.className='msg assistant';div.innerHTML=html;
    document.getElementById('messages').appendChild(div);scrollBottom();
  }catch(err){showToast('Error: '+err.message)}
}

// Status pills (above input) — polls /api/agents every 5s
// ════════════════════════════════════════════════════════════════
// Conversational continuity — bind a Project-mode thread to an agent
// ════════════════════════════════════════════════════════════════
// _activeAgentId: while set, sending in Project mode routes the message
// to that agent (status query / mid-run instruction) instead of drafting
// a brand-new project. Cleared automatically when the agent reaches a
// terminal status (done / failed / aborted), or by user clicking ×
// on the "Talking to …" chip above the composer.
var _activeAgentId = null;
try { _activeAgentId = _lsGet('codec-active-agent') || null; } catch(e) {}

function setActiveAgent(id){
  _activeAgentId = id;
  try {
    if (id) _lsSet('codec-active-agent', id);
    else    _lsDel('codec-active-agent');
  } catch(e) {}
  renderActiveAgentChip();
}

function renderActiveAgentChip(){
  var bar = document.getElementById('activeAgentChip');
  if (!bar){
    var inputArea = document.querySelector('.input-area');
    if (!inputArea) return;
    bar = document.createElement('div');
    bar.id = 'activeAgentChip';
    bar.style.cssText = 'display:none;align-items:center;gap:8px;margin:0 16px 6px;padding:6px 12px;background:var(--surface-2,#1f2937);border:1px solid var(--border,#374151);border-radius:18px;font-size:calc(12px * var(--fs-scale));color:var(--text,#e5e7eb);max-width:fit-content';
    inputArea.parentNode.insertBefore(bar, inputArea);
  }
  if (!_activeAgentId){
    bar.style.display='none';
    var lp = document.getElementById('livePreviewPanel');
    if (lp) lp.style.display = 'none';
    return;
  }
  bar.style.display = 'inline-flex';
  bar.innerHTML =
    '<span style="width:6px;height:6px;border-radius:50%;background:var(--running);animation:pulse 2s infinite"></span>'+
    '<span style="opacity:.85">Talking to <code style="opacity:1;font-family:var(--font-mono,ui-monospace)">'+escHtml(_activeAgentId.slice(0,12))+'</code></span>'+
    '<span style="opacity:.5">·</span>'+
    '<a href="#" onclick="toggleLivePreview(event)" id="livePreviewToggle" style="color:var(--text-muted,#9ca3af);text-decoration:none;font-size:calc(13px * var(--fs-scale))" title="Show what the agent is producing">preview</a>'+
    '<span style="opacity:.5">·</span>'+
    '<a href="#" onclick="exitConversation(event)" style="color:var(--text-muted,#9ca3af);text-decoration:none;font-size:calc(13px * var(--fs-scale))" title="Exit conversation — next message will draft a new project">exit</a>';
  renderLivePreviewPanel();
}

// ── Live preview panel: shows recent files produced by the active agent ──────
var _livePreviewOpen = (_lsGet('codec-live-preview') === 'true');
var _livePreviewTimer = null;
function toggleLivePreview(e){
  if (e) e.preventDefault();
  _livePreviewOpen = !_livePreviewOpen;
  try { _lsSet('codec-live-preview', _livePreviewOpen ? 'true' : 'false'); } catch(err){}
  renderLivePreviewPanel();
}
function renderLivePreviewPanel(){
  var panel = document.getElementById('livePreviewPanel');
  if (!panel){
    var chip = document.getElementById('activeAgentChip');
    if (!chip) return;
    panel = document.createElement('div');
    panel.id = 'livePreviewPanel';
    panel.style.cssText = 'display:none;margin:0 16px 8px;padding:10px 12px;background:var(--surface-2,#1f2937);border:1px solid var(--border,#374151);border-radius:8px;font-size:calc(12px * var(--fs-scale));color:var(--text,#e5e7eb)';
    chip.parentNode.insertBefore(panel, chip.nextSibling);
  }
  if (!_activeAgentId || !_livePreviewOpen){
    panel.style.display = 'none';
    if (_livePreviewTimer){ clearInterval(_livePreviewTimer); _livePreviewTimer = null; }
    return;
  }
  panel.style.display = 'block';
  pollLivePreview();   // immediate populate
  if (!_livePreviewTimer){
    _livePreviewTimer = setInterval(function(){
      if (!_activeAgentId || !_livePreviewOpen){
        clearInterval(_livePreviewTimer); _livePreviewTimer = null;
        return;
      }
      pollLivePreview();
    }, 5000);
  }
}
async function pollLivePreview(){
  if (!_activeAgentId) return;
  var panel = document.getElementById('livePreviewPanel');
  if (!panel) return;
  try {
    var r = await fetch('/api/agents/'+encodeURIComponent(_activeAgentId)+'/files?limit=10');
    if (!r.ok) return;
    var d = await r.json();
    var files = d.files || [];
    var projectDir = d.project_dir || '';
    var header =
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">'+
        '<div style="font-weight:600;letter-spacing:.04em;opacity:.7;text-transform:uppercase;font-size:calc(12px * var(--fs-scale))">Live · agent workspace</div>'+
        '<div style="display:flex;gap:8px">'+
          (projectDir ? '<a href="#" onclick="openAgentFolder(\''+encodeURIComponent(_activeAgentId)+'\',event)" style="color:var(--text-muted,#9ca3af);text-decoration:none;font-size:calc(12px * var(--fs-scale))">open folder</a>' : '')+
          '<a href="#" onclick="toggleLivePreview(event)" style="color:var(--text-muted,#9ca3af);text-decoration:none;font-size:calc(12px * var(--fs-scale))">close</a>'+
        '</div>'+
      '</div>';
    if (!files.length){
      panel.innerHTML = header + '<div style="opacity:.5;font-style:italic">No files yet — agent hasn\'t produced output in this folder.</div>';
      return;
    }
    var rows = files.map(function(f){
      var ago = Math.max(0, Math.round(Date.now()/1000 - (f.mtime||0)));
      var agoStr = ago < 60 ? ago + 's' : ago < 3600 ? Math.round(ago/60) + 'm' : Math.round(ago/3600) + 'h';
      var sizeKB = f.size_bytes < 1024 ? f.size_bytes + 'B' : (f.size_bytes/1024).toFixed(1) + 'K';
      return '<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-family:var(--font-mono,ui-monospace);font-size:calc(12px * var(--fs-scale))">'+
        '<span style="opacity:.85">'+escHtml(f.rel_path)+'</span>'+
        '<span style="opacity:.5">'+sizeKB+' · '+agoStr+' ago</span>'+
      '</div>';
    }).join('');
    panel.innerHTML = header + rows;
  } catch(e){ /* silent */ }
}
async function openAgentFolder(agentIdEnc, e){
  if (e) e.preventDefault();
  try {
    var r = await fetch('/api/agents/'+agentIdEnc+'/open-folder', {method:'POST'});
    if (r.ok) { showToast('Opened in Finder'); return; }
    var d = {}; try { d = await r.json(); } catch(_){}
    showToast('Could not open folder: ' + (d.error || d.detail || ('HTTP ' + r.status)), true);
  } catch(err){ showToast('Could not open folder: ' + err.message, true); }
}

function exitConversation(e){
  if (e) e.preventDefault();
  if (!_activeAgentId) return;
  var prev = _activeAgentId;
  setActiveAgent(null);
  addMessage('assistant', 'Exited conversation with `'+prev.slice(0,12)+'`. Your next Project-mode message will draft a fresh plan.');
}

// Poll the agent's timeline briefly for any new assistant reply after we
// post a user message, so the user sees a response in-thread rather than
// having to look at status pills.
async function schedulePollAgentTimeline(agentId, hostEl){
  var since = Date.now()/1000;
  var ticks = 0;
  var maxTicks = 15;   // ~30s @ 2s interval
  var poll = setInterval(async function(){
    ticks++;
    if (ticks > maxTicks){ clearInterval(poll); return; }
    try {
      var r = await fetch('/api/agents/'+encodeURIComponent(agentId)+'/messages');
      if (!r.ok) return;
      var data = await r.json();
      var msgs = (data.messages || []).filter(function(m){
        return (m.ts || 0) > since && ['agent_reply','agent_status','plan_revision','agent_update','agent_blocked','agent_question','agent_done','agent_aborted'].indexOf(m.type) >= 0;
      });
      if (msgs.length){
        clearInterval(poll);
        var lines = msgs.map(function(m){
          var body = m.body || m.text || JSON.stringify(m);
          return body;
        }).join('\n\n');
        if (hostEl){
          hostEl.querySelector('.msg-bubble').innerHTML =
            '<span style="opacity:.6;font-size:calc(12px * var(--fs-scale))">'+escHtml(agentId.slice(0,12))+' replied:</span><br>'+escHtml(lines);
        } else {
          addMessage('assistant', lines);
        }
      }
    } catch(e){ /* silent */ }
  }, 2000);
}

// Auto-clear binding when the bound agent reaches a terminal status.
// Wired into the existing status-pill polling tick.
async function checkActiveAgentLifecycle(){
  if (!_activeAgentId) return;
  try {
    var r = await fetch('/api/agents/'+encodeURIComponent(_activeAgentId));
    if (r.status === 404){ setActiveAgent(null); return; }
    if (!r.ok) return;
    var data = await r.json();
    var status = (data.manifest && data.manifest.status) || data.status || '';
    // Resume live updates after a page reload while the agent is active
    // (2026-07 demo fix — poller previously only started from the approve click).
    var activeStates = ['approved','running','paused'];
    if (activeStates.indexOf(status) >= 0 || status.indexOf('blocked_') === 0){
      _startAgentPoller(_activeAgentId);
    }
    var terminal = ['done','complete','completed','failed','error','aborted','user_aborted'];
    if (terminal.indexOf(status) >= 0){
      addMessage('assistant', '`'+_activeAgentId.slice(0,12)+'` reached `'+status+'`. Conversation closed — next message starts a fresh project.');
      setActiveAgent(null);
    }
  } catch(e){ /* silent */ }
}

// Show the chip on page load if a binding survived
setTimeout(renderActiveAgentChip, 100);

async function refreshAgentStatusPills(){
  var container=document.getElementById('agentStatusPills');
  if(!container){
    // Inject the container right above the input area
    var inputArea=document.querySelector('.input-area');
    if(!inputArea)return;
    container=document.createElement('div');
    container.id='agentStatusPills';
    container.style.cssText='display:none;flex-wrap:wrap;gap:6px;margin:0 16px 6px;font-size:calc(12px * var(--fs-scale))';
    inputArea.parentNode.insertBefore(container,inputArea);
  }
  try{
    var r=await fetch('/api/agents');
    if(r.status===401||r.status===403)return;
    if(!r.ok)return;
    var data=await r.json();
    var pills=(data.agents||[]).filter(function(a){
      return ['running','paused','blocked_on_permission','blocked_on_destructive',
              'awaiting_approval','draft_pending','crashed_resumed'].indexOf(a.status)>=0;
    }).slice(0,5);
    if(pills.length===0){container.style.display='none';container.innerHTML='';return}
    container.style.display='flex';
    container.innerHTML=pills.map(function(p){
      // Status pill: a 14% tint of the hue behind text in that hue; draft_pending stays neutral.
      var hue='';
      if(p.status==='running')hue='success';
      else if(p.status==='paused'||p.status==='crashed_resumed')hue='warning';
      else if(p.status==='awaiting_approval')hue='info';
      else if(p.status==='blocked_on_permission'||p.status==='blocked_on_destructive')hue='danger';
      var fg=hue?'var(--'+hue+'-text)':'var(--text-muted)',bg=hue?'var(--'+hue+'-tint)':'var(--surface-3)';
      var actions='';
      if(p.status==='awaiting_approval'){
        actions=' <a href="#" onclick="approveAgentInChat(\''+p.agent_id+'\',event)" style="color:inherit;text-decoration:underline;margin-left:4px">approve</a>';
      }else if(p.status==='paused'){
        actions=' <a href="#" onclick="resumeAgentInChat(\''+p.agent_id+'\',event)" style="color:inherit;text-decoration:underline;margin-left:4px">resume</a>';
      }else if(p.status==='running'){
        actions=' <a href="#" onclick="pauseAgentInChat(\''+p.agent_id+'\',event)" style="color:inherit;text-decoration:underline;margin-left:4px">pause</a>';
      }
      actions+=' <a href="#" onclick="abortAgentInChat(\''+p.agent_id+'\',event)" style="color:inherit;text-decoration:underline;margin-left:4px">abort</a>';
      return '<span style="display:inline-flex;align-items:center;padding:3px 10px;background:'+bg+';color:'+fg+';border-radius:10px">'+
             escHtml((p.title||p.agent_id).slice(0,40))+' · '+p.status+actions+'</span>';
    }).join('');
  }catch(e){/* silent */}
}
async function pauseAgentInChat(agentId,e){if(e)e.preventDefault();await fetch('/api/agents/'+encodeURIComponent(agentId)+'/pause',{method:'POST'});refreshAgentStatusPills()}
async function resumeAgentInChat(agentId,e){if(e)e.preventDefault();await fetch('/api/agents/'+encodeURIComponent(agentId)+'/resume',{method:'POST'});refreshAgentStatusPills()}
async function abortAgentInChat(agentId,e){if(e)e.preventDefault();if(!confirm('Abort agent '+agentId+'?'))return;await fetch('/api/agents/'+encodeURIComponent(agentId)+'/abort',{method:'POST'});refreshAgentStatusPills()}
setTimeout(refreshAgentStatusPills,500);setInterval(function(){ refreshAgentStatusPills(); checkActiveAgentLifecycle(); },5000);
